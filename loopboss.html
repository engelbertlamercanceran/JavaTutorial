<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HACKO: Loop Dungeon - The Pattern Boss</title>

<link rel="stylesheet" href="shared/hacko.css">
<script src="shared/audio.js" data-track="boss"></script>
<script src="shared/storage.js"></script>
<script src="shared/javaloop.js"></script>

<style>
body {
    margin: 0;
    display: grid;
    grid-template-rows: auto 1fr auto;
    min-height: 100vh;
    overflow-x: hidden;
}

header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 10px 18px;
    border-bottom: 2px solid var(--hk-cyan);
    background: rgba(8, 21, 38, 0.93);
}

.brand {
    font: 900 clamp(1rem, 2.6vw, 1.5rem) var(--hk-display);
    color: var(--hk-cyan);
}

.brand small {
    display: block;
    font-size: 0.5rem;
    letter-spacing: 0.2em;
    color: #fff;
}

main {
    display: grid;
    grid-template-columns: 1fr 420px;
    gap: 12px;
    padding: 12px;
    min-height: 0;
}

/* ---------- arena ---------- */

.arena {
    position: relative;
    border: 3px solid #ff3d68;
    border-radius: 16px;
    background:
        radial-gradient(circle at 50% 0%, #3a0d22, transparent 60%),
        #07111f;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 460px;
}

.arena.safe { border-color: #3cd9e9; }

.arena.shake { animation: shake 0.25s; }

@keyframes shake {
    0%, 100% { transform: translate(0, 0); }
    25% { transform: translate(-6px, 3px); }
    50% { transform: translate(5px, -3px); }
    75% { transform: translate(-3px, -2px); }
}

.phase {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 14px;
    background: rgba(2, 8, 16, 0.75);
    font: 700 0.76rem var(--hk-display);
}

.phase .tag { color: #ff8aa5; }
.arena.safe .phase .tag { color: var(--hk-cyan); }

.bossbar {
    flex: 1;
    height: 12px;
    max-width: 320px;
    border: 1px solid #ff3d68;
    border-radius: 999px;
    background: #12060c;
    overflow: hidden;
}

.bossbar > i {
    display: block;
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #ff3d68, #ff8a3d);
    transition: width 0.35s ease;
}

.grid-wrap {
    flex: 1;
    display: grid;
    place-items: center;
    padding: 14px;
}

#grid {
    display: grid;
    gap: 5px;
}

.cell {
    width: 34px;
    height: 34px;
    border-radius: 5px;
    background: rgba(69, 243, 255, 0.06);
    border: 1px solid rgba(69, 243, 255, 0.18);
    display: grid;
    place-items: center;
    font: 700 13px var(--hk-display);
    color: #4b7d95;
    transition: background 0.1s, border-color 0.1s;
}

.cell.firing {
    background: #ff3d68;
    border-color: #ff8aa5;
    box-shadow: 0 0 16px #ff174f;
    color: #fff;
}

.cell.player {
    outline: 3px solid var(--hk-lime);
    outline-offset: -3px;
}

.cell.player::after {
    content: "";
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: var(--hk-lime);
    box-shadow: 0 0 12px var(--hk-lime);
}

.readout {
    text-align: center;
    padding: 6px;
    font: 700 0.72rem var(--hk-display);
    color: #ff8aa5;
    min-height: 1.6em;
}

.arena.safe .readout { color: var(--hk-cyan); }

.hpwrap {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 14px 10px;
}

.hpbar {
    flex: 1;
    height: 10px;
    border: 1px solid var(--hk-lime);
    border-radius: 999px;
    background: #071421;
    overflow: hidden;
}

.hpbar > i {
    display: block;
    height: 100%;
    width: 100%;
    background: var(--hk-lime);
    transition: width 0.2s;
}

/* ---------- shield select ---------- */

/* Every other mission lets a player go back to an earlier
   level. This one did not, so a cleared shield could never
   be replayed. */
.shields {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin: 10px 0 2px;
}

.shields button {
    width: 30px;
    height: 30px;
    border-radius: 7px;
    border: 1px solid var(--hk-line);
    background: #0b1c30;
    color: var(--hk-muted);
    cursor: pointer;
    font: 700 12px var(--hk-display);
}

.shields button:hover:not(:disabled) {
    border-color: var(--hk-cyan);
    color: var(--hk-cyan);
}

.shields button.done {
    border-color: var(--hk-lime);
    color: var(--hk-lime);
}

.shields button.current {
    background: var(--hk-cyan);
    border-color: var(--hk-cyan);
    color: #06111c;
}

.shields button:disabled {
    opacity: 0.32;
    cursor: not-allowed;
}

/* ---------- terminal ---------- */

.side {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 0;
}

.locked { opacity: 0.4; pointer-events: none; }

#target, #yours {
    background: #02080e;
    color: #a7ffc5;
    font: 13px/1.45 Consolas, monospace;
    padding: 10px;
    border-radius: 8px;
    white-space: pre;
    overflow: auto;
    max-height: 150px;
}

#yours { color: #ffd0da; }

#editor {
    width: 100%;
    height: 170px;
    background: #1e1e1e;
    color: #d4d4d4;
    font: 13px/1.5 Consolas, monospace;
    padding: 10px;
    border: 1px solid #333;
    border-radius: 8px;
    resize: vertical;
}

.diff {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

.diff h4 {
    margin: 0 0 4px;
    font: 700 0.64rem var(--hk-display);
    color: var(--hk-muted);
    letter-spacing: 0.1em;
}

#verdict {
    min-height: 2.4em;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 0.88rem;
    line-height: 1.4;
    white-space: pre-wrap;
}

#verdict.ok {
    border: 1px solid var(--hk-lime);
    background: rgba(145, 255, 111, 0.1);
    color: #b6ff9e;
}

#verdict.bad {
    border: 1px solid var(--hk-red);
    background: rgba(255, 73, 111, 0.1);
    color: #ff9eb3;
}

footer {
    text-align: center;
    padding: 7px;
    background: #071526;
    border-top: 1px solid #2d6580;
    color: #b8d8e5;
    font-size: 0.82rem;
}

.kbd {
    padding: 2px 6px;
    border: 1px solid #4b819d;
    border-radius: 4px;
    background: #193b57;
    font: 700 0.66rem var(--hk-display);
}

@media (max-width: 1000px) {
    main { grid-template-columns: 1fr; }
}
</style>
</head>

<body class="hk-body">

<header>
    <div class="brand">HACKO<small>LOOP DUNGEON - THE PATTERN BOSS</small></div>

    <div class="hk-hud">
        <span class="hk-chip">SHIELD <b id="hudLevel">1</b>/10</span>
        <span class="hk-chip hk-chip--lives">LIVES <b id="hudLives">3</b></span>
        <span class="hk-chip">XP <b id="hudXP">0</b></span>
    </div>
</header>

<main>
    <div class="arena" id="arena">

        <div class="phase">
            <span class="tag" id="phaseTag">INCOMING</span>
            <div class="bossbar"><i id="bossHP"></i></div>
            <span id="phaseTimer">0:00</span>
        </div>

        <div class="grid-wrap"><div id="grid"></div></div>

        <div class="readout" id="readout"></div>

        <div class="hpwrap">
            <span style="font:700 .66rem var(--hk-display);color:var(--hk-lime)">HACKO</span>
            <div class="hpbar"><i id="playerHP"></i></div>
        </div>
    </div>

    <div class="side">
        <div class="hk-panel">
            <h3 id="levelTitle">SHIELD 1</h3>
            <p class="hk-note" id="levelGoal"></p>

            <div class="shields" id="shieldSelect"></div>

            <div class="diff" style="margin-top:8px">
                <div>
                    <h4>BOSS PATTERN</h4>
                    <div id="target"></div>
                </div>
                <div>
                    <h4>YOUR OUTPUT</h4>
                    <div id="yours">(not run yet)</div>
                </div>
            </div>
        </div>

        <div class="hk-panel" id="terminal">
            <h3>TERMINAL</h3>
            <textarea id="editor" spellcheck="false"></textarea>

            <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
                <button class="hk-btn" id="runBtn">RUN CODE</button>
                <button class="hk-btn hk-btn--ghost" id="hintBtn">HINT</button>
            </div>

            <div id="verdict"></div>
        </div>
    </div>
</main>

<footer>
    <span class="kbd">WASD</span> dodge the sweep &mdash;
    <span class="kbd">CTRL</span>+<span class="kbd">ENTER</span> run your code.
    The cell lighting up is the one the boss is printing.
</footer>

<script>
(function () {
    "use strict";

    var MISSION = 10;

    /* ---------------------------------------------------
       SHIELDS

       Each shield is both the pattern the boss projects into
       the arena AND the output the player has to reproduce.
       Dodging the sweep is how you read the pattern; writing
       the loop is how you fire it back.
    --------------------------------------------------- */

    var SHIELDS = [
        {
            title: "FIRST LOOP",
            goal: "One loop, five numbers on a single line.",
            target: "1 2 3 4 5",
            starter: "for (int i = ___; i ___; i++) {\n    // print i and a space\n}",
            sweep: 330,
            hints: [
                "A loop needs a start, a stop and a step.",
                "Everything lands on one line, so use print rather than println.",
                "Example printing three: for (int n = 1; n <= 3; n++) System.out.print(n + \" \");"
            ]
        },
        {
            title: "REPEAT",
            goal: "The same value, four times.",
            target: "A A A A",
            starter: "for (int i = 1; i <= ___; i++) {\n    // print A and a space\n}",
            sweep: 310,
            hints: [
                "The counter controls how many times, not what is printed.",
                "Nothing inside the loop has to mention the counter at all.",
                "A loop repeats a fixed action as easily as a changing one."
            ]
        },
        {
            title: "ROWS",
            goal: "The same row, three times. One loop inside another.",
            target: "1 2 3\n1 2 3\n1 2 3",
            starter: "for (int row = 1; row <= 3; row++) {\n\n    // an inner loop prints 1 2 3\n\n    // then end the line\n}",
            sweep: 270,
            hints: [
                "Three identical rows means something repeats three times.",
                "The outer loop counts rows. The inner loop fills one row.",
                "println() with nothing in it just ends the current line."
            ]
        },
        {
            title: "TRIANGLE",
            goal: "Each row one star longer than the last.",
            target: "*\n**\n***\n****\n*****",
            starter: "for (int row = 1; row <= 5; row++) {\n\n    // print as many stars as this row number\n\n}",
            sweep: 235,
            hints: [
                "The rows are not all the same length any more.",
                "The inner loop should not always stop at the same number.",
                "Let the inner loop run up to whatever row it is currently on."
            ]
        },
        {
            title: "NUMBER WAVE",
            goal: "Counting up, one more digit each row.",
            target: "1\n12\n123\n1234\n12345",
            starter: "for (int row = 1; row <= 5; row++) {\n\n    // count up to this row number\n\n}",
            sweep: 215,
            hints: [
                "Same shape as the triangle, but the stars became numbers.",
                "Each row counts from 1 up to that row's number.",
                "Print the inner counter itself instead of a fixed character."
            ]
        },
        {
            title: "REVERSE WAVE",
            goal: "The wave, walked backwards.",
            target: "12345\n1234\n123\n12\n1",
            starter: "for (int row = ___; row ___; row___) {\n\n    // count up to this row number\n\n}",
            sweep: 200,
            hints: [
                "The inner loop is unchanged. Only the outer one differs.",
                "Start at the widest row and step downwards.",
                "Two minus signs subtract one, just as two plus signs add one."
            ]
        },
        {
            title: "SQUARE SHIELD",
            goal: "A solid four by four block.",
            target: "####\n####\n####\n####",
            starter: "for (int row = 1; row <= 4; row++) {\n\n    // four hashes, then end the line\n\n}",
            sweep: 180,
            hints: [
                "Every row is identical, so the inner loop is fixed.",
                "Sixteen cells from two loops of four.",
                "print keeps the row going, println ends it."
            ]
        },
        {
            title: "SPIKE SHIELD",
            goal: "A growing wall of hashes.",
            target: "#\n##\n###\n####\n#####",
            starter: "for (int row = 1; row <= 5; row++) {\n\n    // this row's hashes\n\n}",
            sweep: 165,
            hints: [
                "You have built this shape before with a different character.",
                "The inner loop runs up to the current row.",
                "Only the printed character changed."
            ]
        },
        {
            title: "NUMBER SHIELD",
            goal: "Each row repeats its own number, that many times.",
            target: "1\n22\n333\n4444\n55555",
            starter: "for (int row = 1; row <= 5; row++) {\n\n    // print the row number, row times\n\n}",
            sweep: 152,
            hints: [
                "Row three shows 333 - the row number repeated three times.",
                "The inner loop controls how many, the outer controls what.",
                "Print the OUTER counter from inside the inner loop."
            ]
        },
        {
            title: "THE PATTERN BOSS",
            goal: "A four by four checkerboard. Loops and a condition.",
            target: "*.*.\n.*.*\n*.*.\n.*.*",
            starter: "for (int row = 1; row <= 4; row++) {\n\n    for (int col = 1; col <= 4; col++) {\n        // star or dot?\n    }\n\n    // end the line\n}",
            sweep: 135,
            hints: [
                "The character flips every step, across and downwards.",
                "Look at what row and col add up to on the starred squares.",
                "When that total is even print one character, when odd the other."
            ]
        }
    ];


    /* ---------------------------------------------------
       STATE
    --------------------------------------------------- */

    var state = {
        level: 0,
        lives: 3,
        xp: 0,
        hp: 100,
        bossHP: 100,
        phase: "attack",
        player: { r: 0, c: 0 },
        rows: [],
        sweepAt: 0,
        timer: null,
        clock: 0,
        hintTier: 0,
        won: false
    };

    function $(id) { return document.getElementById(id); }

    /* Splits a target into a grid, padding short rows so the
       arena stays rectangular. */
    function toGrid(target) {

        var lines = target.split("\n");

        var width = lines.reduce(function (widest, line) {
            return Math.max(widest, line.length);
        }, 0);

        return lines.map(function (line) {

            var row = [];

            for (var i = 0; i < width; i++) {
                row.push(line[i] === undefined ? " " : line[i]);
            }

            return row;
        });
    }

    function buildGrid() {

        var grid = $("grid");

        grid.innerHTML = "";
        grid.style.gridTemplateColumns =
            "repeat(" + state.rows[0].length + ", 34px)";

        state.rows.forEach(function (row, r) {
            row.forEach(function (value, c) {

                var cell = document.createElement("div");

                cell.className = "cell";
                cell.id = "cell-" + r + "-" + c;
                cell.textContent = value === " " ? "" : value;

                grid.appendChild(cell);
            });
        });

        paintPlayer();
    }

    function paintPlayer() {

        var all = $("grid").querySelectorAll(".cell");

        for (var i = 0; i < all.length; i++) {
            all[i].classList.remove("player");
        }

        var here = $("cell-" + state.player.r + "-" + state.player.c);

        if (here) {
            here.classList.add("player");
        }
    }

    /* Which shields the player may jump to: everything they
       have cleared, plus the next one along. */
    function clearedShields() {

        if (!window.HackoStore || !HackoStore.isLoggedIn()) {
            return [];
        }

        return HackoStore.mission(MISSION).levelsDone || [];
    }

    function renderShieldSelect() {

        var box = $("shieldSelect");
        var done = clearedShields();

        var furthest = done.length
            ? Math.max.apply(null, done)
            : -1;

        box.innerHTML = "";

        SHIELDS.forEach(function (shield, index) {

            var button = document.createElement("button");

            button.type = "button";
            button.textContent = index + 1;
            button.title = "Shield " + (index + 1) + " - " + shield.title;

            var cleared = done.indexOf(index) !== -1;
            var reachable = index <= furthest + 1 || index <= state.level;

            if (cleared) {
                button.classList.add("done");
            }

            if (index === state.level) {
                button.classList.add("current");
            }

            button.disabled = !reachable;

            button.addEventListener("click", function () {

                if (index === state.level) {
                    return;
                }

                HackoAudio.play("select");
                loadLevel(index);
            });

            box.appendChild(button);
        });
    }

    function updateHUD() {
        $("hudLevel").textContent = state.level + 1;
        $("hudLives").textContent = state.lives;
        $("hudXP").textContent = state.xp;
        $("playerHP").style.width = Math.max(0, state.hp) + "%";
        $("bossHP").style.width = Math.max(0, state.bossHP) + "%";
    }

    function setVerdict(text, good) {
        $("verdict").textContent = text;
        $("verdict").className = text ? (good ? "ok" : "bad") : "";
    }


    /* ---------------------------------------------------
       ATTACK PHASE

       The boss sweeps its pattern cell by cell, in exactly
       the order nested loops print it: across a row, then
       down to the next. Standing on the cell being printed
       costs health - so surviving the sweep IS reading the
       pattern you are about to write.
    --------------------------------------------------- */

    function startAttack() {

        state.phase = "attack";
        state.sweepAt = 0;

        $("arena").classList.remove("safe");
        $("phaseTag").textContent = "INCOMING";
        $("phaseTimer").textContent = "";
        $("terminal").classList.add("locked");

        window.clearInterval(state.timer);
        state.timer = window.setInterval(sweepStep, SHIELDS[state.level].sweep);
    }

    function sweepStep() {

        var cols = state.rows[0].length;
        var total = state.rows.length * cols;
        var prev = state.sweepAt - 1;

        if (prev >= 0) {

            var old = $("cell-" + Math.floor(prev / cols) + "-" + (prev % cols));

            if (old) {
                old.classList.remove("firing");
            }
        }

        if (state.sweepAt >= total) {
            startCode();
            return;
        }

        var r = Math.floor(state.sweepAt / cols);
        var c = state.sweepAt % cols;
        var cell = $("cell-" + r + "-" + c);

        if (cell) {
            cell.classList.add("firing");
        }

        $("readout").textContent =
            "row " + (r + 1) + "  /  col " + (c + 1) +
            "   -  the boss is printing its pattern";

        if (state.player.r === r && state.player.c === c) {
            takeHit();
        } else {
            HackoAudio.play("step");
        }

        state.sweepAt += 1;
    }

    /* Lethal, but it never takes your code.
     *
     * Four hits kill. Dying costs a life and throws you back to the
     * start of the sweep, so you have to survive the pattern again
     * before the terminal reopens - the setback is time and pressure.
     * What stays untouched is the editor: being made to retype a
     * nested loop you already wrote is tedium, not difficulty, and it
     * would teach players to stop dodging and just wait out the clock.
     */
    function takeHit() {

        HackoAudio.play("hit");

        state.hp = Math.max(0, state.hp - 25);

        $("arena").classList.add("shake");

        window.setTimeout(function () {
            $("arena").classList.remove("shake");
        }, 260);

        state.player.c = (state.player.c + 1) % state.rows[0].length;
        paintPlayer();

        if (state.hp <= 0) {
            die();
            return;
        }

        updateHUD();
    }

    function die() {

        window.clearInterval(state.timer);

        state.lives -= 1;
        state.hp = 100;
        state.xp = Math.max(0, state.xp - 50);

        HackoAudio.play("gameover");

        if (state.lives <= 0) {

            /* Client rule: out of lives drops back one shield. */
            state.lives = 3;
            state.xp = Math.max(0, state.xp - 100);

            var back = window.HackoStore
                ? HackoStore.loseAllLives(MISSION, state.level)
                : Math.max(0, state.level - 1);

            $("readout").textContent = "HACKO DOWN";
            updateHUD();

            window.setTimeout(function () {
                loadLevel(back);
            }, 1200);

            return;

        } else {

            setVerdict(
                "HACKO went down. " + state.lives +
                " " + (state.lives === 1 ? "life" : "lives") +
                " left - survive the sweep again. Your code is still here.",
                false
            );
        }

        $("readout").textContent = "HACKO DOWN";
        updateHUD();

        /* back to the start of the sweep, editor untouched */
        window.setTimeout(startAttack, 1200);
    }


    /* ---------------------------------------------------
       CODE PHASE
    --------------------------------------------------- */

    function startCode() {

        state.phase = "code";
        state.clock = 45;

        $("arena").classList.add("safe");
        $("phaseTag").textContent = "SHIELD EXPOSED";
        $("readout").textContent =
            "The pattern is down. Reproduce it before the boss recharges.";
        $("terminal").classList.remove("locked");

        window.clearInterval(state.timer);
        state.timer = window.setInterval(tickClock, 1000);

        $("editor").focus();
        tickClock();
    }

    function tickClock() {

        var mins = Math.floor(state.clock / 60);
        var secs = state.clock % 60;

        $("phaseTimer").textContent =
            mins + ":" + (secs < 10 ? "0" : "") + secs;

        if (state.clock <= 0) {

            setVerdict(
                "The boss recharged. Dodge the sweep and try again.",
                false
            );

            HackoAudio.play("wrong");
            startAttack();
            return;
        }

        state.clock -= 1;
    }


    /* ---------------------------------------------------
       RUNNING THE CODE

       The player's Java is actually executed and its output
       compared with the pattern. Any code producing the right
       output wins - there is no expected shape, which is what
       the old regex matching got wrong.
    --------------------------------------------------- */

    function runCode() {

        if (state.phase !== "code" || state.won) {
            return;
        }

        var shield = SHIELDS[state.level];
        var result = HackoJava.run($("editor").value);

        if (result.error) {
            $("yours").textContent = "(did not run)";
            setVerdict("Your code did not run:\n" + result.error, false);
            HackoAudio.play("wrong");
            return;
        }

        $("yours").textContent =
            result.output.replace(/\s+$/, "") || "(printed nothing)";

        var check = HackoJava.compare(result.output, shield.target);

        if (!check.match) {

            setVerdict(
                "Pattern does not match.\n" +
                "Line " + check.line + ":\n" +
                "  you printed  " + JSON.stringify(check.got) + "\n" +
                "  expected     " + JSON.stringify(check.want),
                false
            );

            HackoAudio.play("wrong");
            return;
        }

        strike();
    }

    function strike() {

        state.won = true;
        window.clearInterval(state.timer);

        state.bossHP = 0;
        state.xp += 100 + state.clock;

        setVerdict("PATTERN MATCHED. Shield destroyed.", true);
        $("phaseTag").textContent = "SHIELD BROKEN";
        $("readout").textContent = "Your pattern fires back.";

        HackoAudio.play("win");
        updateHUD();

        var cells = $("grid").querySelectorAll(".cell");
        var i = 0;

        (function fire() {

            if (i >= cells.length) {

                if (window.HackoStore) {
                    HackoStore.completeLevel(MISSION, state.level, 100);
                }

                renderShieldSelect();

                window.setTimeout(function () {

                    if (state.level + 1 < SHIELDS.length) {
                        loadLevel(state.level + 1);
                    } else {
                        $("readout").textContent =
                            "THE PATTERN BOSS IS DEFEATED.";
                        HackoAudio.play("unlock");
                    }
                }, 700);

                return;
            }

            cells[i].classList.add("firing");
            i += 1;

            window.setTimeout(fire, 26);
        }());
    }


    /* ---------------------------------------------------
       LEVELS
    --------------------------------------------------- */

    function loadLevel(index) {

        window.clearInterval(state.timer);

        state.level = Math.max(0, Math.min(index, SHIELDS.length - 1));
        state.won = false;
        state.hp = 100;
        state.bossHP = 100;
        state.hintTier = 0;

        var shield = SHIELDS[state.level];

        state.rows = toGrid(shield.target);

        state.player = {
            r: state.rows.length - 1,
            c: 0
        };

        $("levelTitle").textContent =
            "SHIELD " + (state.level + 1) + " - " + shield.title;
        $("levelGoal").textContent = shield.goal;
        $("target").textContent = shield.target;
        $("yours").textContent = "(not run yet)";
        $("editor").value = shield.starter;

        setVerdict("", true);

        buildGrid();
        renderShieldSelect();
        updateHUD();
        startAttack();
    }


    /* ---------------------------------------------------
       INPUT

       Typing in the editor must never move HACKO, which is
       why the phases alternate rather than overlap.
    --------------------------------------------------- */

    function move(dr, dc) {

        var rows = state.rows.length;
        var cols = state.rows[0].length;

        state.player.r = Math.max(0, Math.min(rows - 1, state.player.r + dr));
        state.player.c = Math.max(0, Math.min(cols - 1, state.player.c + dc));

        paintPlayer();
    }

    window.addEventListener("keydown", function (event) {

        if (event.ctrlKey && event.key === "Enter") {
            event.preventDefault();
            runCode();
            return;
        }

        if (document.activeElement === $("editor")) {
            return;
        }

        var key = event.key.toLowerCase();

        if (key === "arrowup" || key === "w") { move(-1, 0); }
        else if (key === "arrowdown" || key === "s") { move(1, 0); }
        else if (key === "arrowleft" || key === "a") { move(0, -1); }
        else if (key === "arrowright" || key === "d") { move(0, 1); }
        else { return; }

        event.preventDefault();
    });

    $("runBtn").addEventListener("click", runCode);

    $("hintBtn").addEventListener("click", function () {

        var tiers = SHIELDS[state.level].hints;
        var tier = Math.min(state.hintTier, tiers.length - 1);
        var label = ["NUDGE", "STRUCTURE", "EXAMPLE"][tier] || "HINT";

        setVerdict(label + ": " + tiers[tier], true);
        HackoAudio.play("select");

        if (state.hintTier < tiers.length - 1) {
            state.hintTier += 1;
        }
    });

    loadLevel(0);


    /* ---------------------------------------------------
       RESUME + AUTOSAVE
    --------------------------------------------------- */

    (function () {

        if (!window.HackoStore || !HackoStore.isLoggedIn()) {
            return;
        }

        HackoStore.registerTotalLevels(MISSION, SHIELDS.length);

        function goToSavedLevel() {

            var resume = HackoStore.getResumeLevel(MISSION);

            if (resume > 0 && resume < SHIELDS.length) {
                loadLevel(resume);
            }
        }

        if (document.readyState === "complete") {
            window.setTimeout(goToSavedLevel, 0);
        } else {
            window.addEventListener("load", function () {
                window.setTimeout(goToSavedLevel, 0);
            });
        }

        HackoStore.bindAutosave(function () {
            return {
                mission: MISSION,
                level: state.level,
                lives: state.lives
            };
        });
    }());

}());
</script>
</body>
</html>
