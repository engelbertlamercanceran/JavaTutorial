<html lang="en">

<style>
body { margin: 0; display: grid; grid-template-rows: auto 1fr auto; min-height: 100vh; }

header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 14px; padding: 10px 18px;
    border-bottom: 2px solid var(--hk-cyan);
    background: rgba(8, 21, 38, 0.93);
}

.brand { font: 900 clamp(1rem, 2.6vw, 1.5rem) var(--hk-display); color: var(--hk-cyan); }
.brand small { display: block; font-size: 0.5rem; letter-spacing: 0.2em; color: #fff; }

main {
    display: grid; grid-template-columns: 1fr 430px;
    gap: 12px; padding: 12px; min-height: 0;
}

.duel {
    display: flex; flex-direction: column; gap: 10px;
    border: 3px solid #ff3d68; border-radius: 16px;
    background: radial-gradient(circle at 50% 0%, #3a0d22, transparent 62%), #07111f;
    padding: 14px; min-height: 470px;
}

.duel.won { border-color: var(--hk-lime); }

.bosshead { display: flex; align-items: center; gap: 12px; }

.bossface {
    width: 54px; height: 54px; border-radius: 50%;
    background: #551334; border: 3px solid #ff3d68;
    box-shadow: 0 0 22px #ff174f;
    display: grid; place-items: center; font-size: 26px; flex: 0 0 auto;
}

.duel.won .bossface {
    background: #143a22; border-color: var(--hk-lime);
    box-shadow: 0 0 22px var(--hk-lime);
}

.bossinfo { flex: 1; min-width: 0; }
.bossinfo b { font: 700 0.8rem var(--hk-display); color: #ff8aa5; }

.bossbar {
    height: 11px; margin-top: 5px; border: 1px solid #ff3d68;
    border-radius: 999px; background: #12060c; overflow: hidden;
}

.bossbar > i {
    display: block; height: 100%; width: 100%;
    background: linear-gradient(90deg, #ff3d68, #ff8a3d);
    transition: width 0.3s;
}

.quote {
    border-left: 3px solid #ff3d68; padding: 8px 12px;
    background: rgba(255, 61, 104, 0.08); border-radius: 0 8px 8px 0;
    font-style: italic; color: #ffc2ce;
}

.brief {
    padding: 9px 12px; border: 1px dashed var(--hk-line);
    border-radius: 8px; color: #cfe6f2; font-size: 0.9rem; line-height: 1.45;
}

.vars { display: flex; flex-wrap: wrap; gap: 6px; }

.var {
    padding: 5px 11px; border: 1px solid var(--hk-amber);
    border-radius: 999px; background: rgba(255, 211, 78, 0.1);
    font: 700 0.74rem Consolas, monospace; color: var(--hk-amber);
}

/* the battlefield */
.field {
    position: relative; border: 1px solid #5a1a33; border-radius: 12px;
    overflow: hidden; background: #050b18;
}

.field canvas { display: block; width: 100%; height: auto; }

.clock {
    position: absolute; top: 8px; right: 12px;
    font: 700 0.8rem var(--hk-display); letter-spacing: 0.08em;
    color: var(--hk-cyan); text-shadow: 0 0 8px #000;
}

.clock.urgent { color: #ff496f; animation: urgent 0.5s steps(2) infinite; }

@keyframes urgent { 50% { opacity: 0.35; } }

.overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
    padding: 18px 8%; text-align: center; white-space: pre-line;
    background: rgba(4, 8, 18, 0.8);
}

.overlay.hidden { display: none; }
.overlay h3 { margin: 0; font: 900 1rem var(--hk-display); color: #ff8aa5; letter-spacing: 0.08em; }
.overlay p { margin: 0; max-width: 560px; color: #cfe6f2; line-height: 1.5; font-size: 0.92rem; }
.overlay .hidden { display: none; }

.callout {
    text-align: center; min-height: 1.6em;
    font: 700 0.78rem var(--hk-display); color: #ff8aa5;
}

.duel.won .callout { color: var(--hk-lime); }

.side { display: flex; flex-direction: column; gap: 10px; }

#editor {
    width: 100%; height: 175px; background: #1e1e1e; color: #d4d4d4;
    font: 13px/1.5 Consolas, monospace; padding: 10px;
    border: 1px solid #333; border-radius: 8px; resize: vertical;
}

#verdict {
    min-height: 2.4em; padding: 9px 11px; border-radius: 8px;
    font-size: 0.87rem; line-height: 1.45; white-space: pre-wrap;
}

#verdict.ok { border: 1px solid var(--hk-lime); background: rgba(145,255,111,.1); color: #b6ff9e; }
#verdict.bad { border: 1px solid var(--hk-red); background: rgba(255,73,111,.1); color: #ff9eb3; }

.phases { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0 2px; }

.phases button {
    width: 30px; height: 30px; border-radius: 7px;
    border: 1px solid var(--hk-line); background: #0b1c30;
    color: var(--hk-muted); cursor: pointer; font: 700 12px var(--hk-display);
}

.phases button.done { border-color: var(--hk-lime); color: var(--hk-lime); }
.phases button.current { background: var(--hk-cyan); border-color: var(--hk-cyan); color: #06111c; }
.phases button:disabled { opacity: 0.32; cursor: not-allowed; }

footer {
    text-align: center; padding: 7px; background: #071526;
    border-top: 1px solid #2d6580; color: #b8d8e5; font-size: 0.82rem;
}

.kbd {
    padding: 2px 6px; border: 1px solid #4b819d; border-radius: 4px;
    background: #193b57; font: 700 0.66rem var(--hk-display);
}

/* difficulty tiers - see TIERS */
.hk-chip b.tier-medium { color: var(--hk-amber); }
.hk-chip b.tier-hard { color: #ff8a3d; }
.hk-chip b.tier-extreme { color: #ff3b5c; text-shadow: 0 0 8px #ff3b5c; }
.phases button.tier-medium { box-shadow: inset 0 -3px 0 var(--hk-amber); }
.phases button.tier-hard { box-shadow: inset 0 -3px 0 #ff8a3d; }
.phases button.tier-extreme { box-shadow: inset 0 -3px 0 #ff3b5c; }
.duel.tier-extreme .bossface { color: #ff3b5c; text-shadow: 0 0 18px #ff3b5c; }

@media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
</style>
</head>

<body class="hk-body">

<header>
    <div class="brand">HACKO<small>THE LOOP MASTER</small></div>
    <div class="hk-hud">
        <span class="hk-chip">PHASE <b id="hudPhase">1</b>/10</span>
        <span class="hk-chip">DIFFICULTY <b id="hudTier" class="tier tier-medium">MEDIUM</b></span>
        <span class="hk-chip hk-chip--lives">LIVES <b id="hudLives">3</b></span>
        <span class="hk-chip">XP <b id="hudXP">0</b></span>
    </div>
</header>

<main>
    <div class="duel" id="duel">

        <div class="bosshead">
            <div class="bossface" id="bossFace">&#129302;</div>
            <div class="bossinfo">
                <b id="bossName">THE LOOP MASTER</b>
                <div class="bossbar"><i id="bossHP"></i></div>
            </div>
        </div>

        <div class="quote" id="bossQuote"></div>
        <div class="brief" id="brief"></div>
        <div class="vars" id="vars"></div>

        <!-- Iron Dome style: its missiles fly in slowly from the
             left, your printed lines are the interceptors. -->
        <div class="field">
            <canvas id="field" width="800" height="340"
                aria-label="The Loop Master robot attacking Hacko's dome"></canvas>
            <div class="clock" id="clock"></div>
            <div class="overlay" id="overlay">
                <h3 id="overlayTitle"></h3>
                <p id="overlayText"></p>
                <button class="hk-btn" id="startBtn" type="button">START</button>
            </div>
        </div>

        <div class="callout" id="callout"></div>
    </div>

    <div class="side">
        <div class="hk-panel">
            <h3 id="phaseTitle">PHASE 1</h3>
            <div class="phases" id="phaseSelect"></div>
        </div>

        <div class="hk-panel">
            <h3>YOUR BATTLE PLAN</h3>
            <textarea id="editor" spellcheck="false"></textarea>

            <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
                <button class="hk-btn" id="runBtn" disabled>FIRE</button>
                <button class="hk-btn hk-btn--ghost" id="hintBtn">HINT</button>
            </div>

            <div id="verdict"></div>
        </div>
    </div>
</main>

<footer>
    Write the loop while its missiles fly, then <span class="kbd">FIRE</span>
    &mdash; or <span class="kbd">CTRL</span>+<span class="kbd">ENTER</span>. Each printed line is one interceptor.
</footer>

<script>
(function () {
    "use strict";

    var MISSION = 10;

    /* =====================================================
       THE LOOP MASTER

       The boss attacks in repeats because it is running a
       loop. Your code is not a pattern to copy - it is a
       battle plan. Every line it prints is one counter-move,
       and the game plays your plan against the attack beat
       by beat, so a missing or wrong move is something you
       watch land rather than something you are told about.

       Each phase is built so ONE loop shape fits:

         for       the boss names its count up front
         while     the count is unknown and is re-rolled on
                   every attempt, so a hardcoded number is
                   wrong most of the time
         do-while  the condition is already false, so a
                   while loop plans nothing at all and the
                   blow lands

       That last case is the only honest way to show why
       do-while exists, and nothing else in this course
       teaches it.
    ===================================================== */

    function times(move, n) {

        var out = [];

        for (var i = 0; i < n; i++) {
            out.push(move);
        }

        return out.join("\n");
    }

    function between(low, high) {
        return low + Math.floor(Math.random() * (high - low + 1));
    }

    var PHASES = [
        {
            title: "THE COUNT",
            name: "LOOP MASTER",
            quote: "I will strike three times. Nothing you do changes that.",
            brief: "It announced the count. Plan one BLOCK per strike.",
            setup: function () { return { strikes: 3 }; },
            expected: function (v) { return times("BLOCK", v.strikes); },
            starter: "for (int i = 1; i <= ___; i++) {\n" +
                "    System.out.println(\"BLOCK\");\n}",
            hints: [
                "It told you exactly how many strikes are coming.",
                "When the count is known before you start, a for loop fits.",
                "Every line your code prints is one counter-move."
            ]
        },
        {
            title: "RELENTLESS",
            name: "LOOP MASTER",
            quote: "Seven blows. Count them if you can.",
            brief: "Same shape, longer chain. One BLOCK per strike.",
            setup: function () { return { strikes: 7 }; },
            expected: function (v) { return times("BLOCK", v.strikes); },
            starter: "for (int i = 1; i <= ___; i++) {\n" +
                "    System.out.println(\"BLOCK\");\n}",
            hints: [
                "Nothing new here - only the number changed.",
                "Check the stop test: <= 7 and < 7 differ by one blow.",
                "One missing line at the end is one strike that lands."
            ]
        },
        {
            title: "THE RAGE",
            name: "LOOP MASTER",
            quote: "I strike while my rage burns. You cannot count what you cannot see.",
            brief: "Its rage falls by one with every block you land. Keep " +
                "blocking while rage is above zero. The rage is DIFFERENT " +
                "every time you fight.",
            setup: function () { return { rage: between(3, 7) }; },
            expected: function (v) { return times("BLOCK", v.rage); },
            starter: "// rage is already declared for you\n\n" +
                "while (___) {\n    System.out.println(\"BLOCK\");\n    ___;\n}",
            hints: [
                "Look at the rage now, then fight again and look once more.",
                "A fixed number cannot survive a value that changes each fight.",
                "A while loop asks its question before every pass - let rage answer it."
            ]
        },
        {
            title: "THE SHIELD",
            name: "LOOP MASTER",
            quote: "Break my shield if you can find its edge.",
            brief: "STRIKE once for every point of shield. The shield is " +
                "different every fight.",
            setup: function () { return { shield: between(4, 8) }; },
            expected: function (v) { return times("STRIKE", v.shield); },
            starter: "// shield is already declared for you\n\n" +
                "while (___) {\n    System.out.println(\"STRIKE\");\n    ___;\n}",
            hints: [
                "The move changed, the thinking did not.",
                "Keep going while there is still shield left.",
                "Forget to reduce the shield and the loop never ends."
            ]
        },
        {
            title: "THE FIRST BLOW",
            name: "LOOP MASTER",
            quote: "My first blow always lands. Even broken, I swing once.",
            brief: "Its rage is ALREADY ZERO - and it still swings once. You " +
                "need exactly one BLOCK. Run the starter as it stands and " +
                "watch what it plans.",
            setup: function () { return { rage: 0 }; },
            expected: function () { return "BLOCK"; },
            starter: "// rage is already declared for you, and it is 0\n\n" +
                "while (rage > 0) {\n    System.out.println(\"BLOCK\");\n" +
                "    rage--;\n}",
            hints: [
                "Fight with the starter unchanged. How many moves did you plan?",
                "A while loop tests BEFORE the first pass, so a false condition plans nothing at all.",
                "There is a loop that runs its body first and asks afterwards - its body always happens at least once."
            ]
        },
        {
            title: "ALWAYS ONE MORE",
            name: "LOOP MASTER",
            quote: "However little fight I have left, I always have one more.",
            brief: "BLOCK once for every point of fury, but it swings once " +
                "even at zero. Fury changes every fight - sometimes it IS zero.",
            setup: function () { return { fury: between(0, 4) }; },
            expected: function (v) { return times("BLOCK", Math.max(1, v.fury)); },
            starter: "// fury is already declared for you\n\n" +
                "do {\n    ___;\n    ___;\n} while (___);",
            hints: [
                "With fury 3 you need three blocks. With fury 0 you still need one.",
                "Only one loop shape guarantees the body runs before any test.",
                "Print, then reduce fury, then ask whether any is left."
            ]
        },
        {
            title: "TWO STANCES",
            name: "LOOP MASTER",
            quote: "I alternate. Read me or fall.",
            brief: "It strikes high then low, over and over. Answer a high " +
                "strike with BLOCK and a low one with DODGE. Odd beats are high.",
            setup: function () { return { strikes: 6 }; },
            expected: function (v) {

                var out = [];

                for (var i = 1; i <= v.strikes; i++) {
                    out.push(i % 2 === 1 ? "BLOCK" : "DODGE");
                }

                return out.join("\n");
            },
            starter: "for (int i = 1; i <= 6; i++) {\n\n" +
                "    // odd beat or even beat?\n\n}",
            hints: [
                "The count is known, so the loop itself is the easy part.",
                "Inside the loop you have to decide which move this beat needs.",
                "A number is odd when the remainder of dividing by 2 is 1."
            ]
        },
        {
            title: "THE WAVES",
            name: "LOOP MASTER",
            quote: "Three waves. Four blows in each. Can you hold them all?",
            brief: "One BLOCK per blow, and shout HOLD after each wave ends.",
            setup: function () { return { waves: 3, perWave: 4 }; },
            expected: function (v) {

                var out = [];

                for (var w = 1; w <= v.waves; w++) {

                    for (var b = 1; b <= v.perWave; b++) {
                        out.push("BLOCK");
                    }

                    out.push("HOLD");
                }

                return out.join("\n");
            },
            starter: "for (int wave = 1; wave <= 3; wave++) {\n\n" +
                "    // four blocks\n\n    // then HOLD\n}",
            hints: [
                "Twelve blows in three groups - one loop is not enough.",
                "The outer loop counts waves; the inner loop counts blows in a wave.",
                "HOLD belongs in the outer loop, after the inner one finishes."
            ]
        },
        {
            title: "THE LAST STAND",
            name: "LOOP MASTER",
            quote: "My guard holds until it breaks. Then I swing once more.",
            brief: "STRIKE once per point of guard, then it always swings once " +
                "at the end - so finish with a single BLOCK. The guard is " +
                "different every fight.",
            setup: function () { return { guard: between(2, 6) }; },
            expected: function (v) {
                return times("STRIKE", v.guard) + "\nBLOCK";
            },
            starter: "// guard is already declared for you\n\n" +
                "while (___) {\n    ___;\n    ___;\n}\n\n" +
                "// it always gets one last swing in",
            hints: [
                "Two ideas back to back: an unknown count, then a guaranteed single move.",
                "The first part keeps going while guard remains.",
                "The last move happens no matter what, so it needs no loop at all."
            ]
        },
        /* Client request: in the final level the Loop Master
           robot itself comes for Hacko. It walks toward the
           dome while the player solves one loop after another -
           every working program blasts it and knocks it back,
           and its life bar drains until it falls. See FINALE. */
        {
            title: "THE LOOP MASTER",
            name: "THE LOOP MASTER",
            quote: "Enough missiles. I will crush your dome with my own hands.",
            brief: "The Loop Master robot is walking toward the dome. Solve " +
                "each loop challenge to blast it - five hits and it falls.",
            finale: true,
            rounds: [
                {
                    title: "POWER UP",
                    brief: "Charge Hacko's cannon: print CHARGE exactly 5 times.",
                    setup: function () { return {}; },
                    expected: function () { return times("CHARGE", 5); },
                    starter: "for (int i = 1; i <= ___; i++) {\n" +
                        "    System.out.println(\"___\");\n}",
                    hints: [
                        "You know the count before you start.",
                        "A for loop runs its body a set number of times.",
                        "Check the stop test: the body must run five times, no more."
                    ]
                },
                {
                    title: "ARMOR PLATES",
                    brief: "Print HIT once for every armor plate. The armor is " +
                        "DIFFERENT every time - and it changes after a miss.",
                    setup: function () { return { armor: between(3, 7) }; },
                    expected: function (v) { return times("HIT", v.armor); },
                    starter: "// armor is already declared for you\n\n" +
                        "while (___) {\n    System.out.println(\"HIT\");\n    ___;\n}",
                    hints: [
                        "You cannot know the count in advance - let armor decide.",
                        "Keep looping while there is armor left.",
                        "Each pass must take one plate away, or the loop never stops."
                    ]
                },
                {
                    title: "THE CORE",
                    brief: "Print SMASH once per point of core - but the core " +
                        "always takes at least one SMASH, even when it is 0.",
                    setup: function () { return { core: between(0, 3) }; },
                    expected: function (v) { return times("SMASH", Math.max(1, v.core)); },
                    starter: "// core is already declared for you - it can be 0\n\n" +
                        "do {\n    ___;\n    ___;\n} while (___);",
                    hints: [
                        "With core 2 you need two SMASH lines. With core 0 you still need one.",
                        "One loop shape runs its body before it ever checks the condition.",
                        "Print, reduce core, then ask whether any is left."
                    ]
                },
                {
                    title: "COUNTDOWN",
                    brief: "Count down from countdown to 1, one number per line, " +
                        "then print FIRE. The countdown is different every time.",
                    setup: function () { return { countdown: between(3, 7) }; },
                    expected: function (v) {
                        var out = [];
                        for (var i = v.countdown; i >= 1; i--) {
                            out.push(String(i));
                        }
                        out.push("FIRE");
                        return out.join("\n");
                    },
                    starter: "// countdown is already declared for you\n\n" +
                        "for (int i = ___; i >= ___; i--) {\n" +
                        "    System.out.println(i);\n}\n\n// then FIRE",
                    hints: [
                        "A loop can count down as well as up.",
                        "Start the counter at the variable and stop after 1.",
                        "FIRE happens once, after the loop has finished."
                    ]
                },
                {
                    title: "FINAL PATTERN",
                    brief: "Waves again, each one blow longer than the last: BLOCK " +
                        "each blow, HOLD after each wave, and finish with ENDURE.",
                    setup: function () { return { waves: 4 }; },
                    expected: function (v) {

                        var out = [];

                        for (var w = 1; w <= v.waves; w++) {

                            for (var b = 1; b <= w; b++) {
                                out.push("BLOCK");
                            }

                            out.push("HOLD");
                        }

                        out.push("ENDURE");

                        return out.join("\n");
                    },
                    starter: "for (int wave = 1; wave <= 4; wave++) {\n\n" +
                        "    // this wave's blocks\n\n    // then HOLD\n}\n\n" +
                        "// one final move",
                    hints: [
                        "Wave one is a single blow, wave four is four - the inner loop grows.",
                        "Let the inner loop run up to whatever wave it is on.",
                        "ENDURE happens once, after every wave is done."
                    ]
                }
            ]
        }
    ];


    var state = {
        phase: 0,
        lives: 3,
        xp: 0,
        vars: {},
        expected: "",
        won: false,
        playing: false
    };

    var hint = null;

    function $(id) { return document.getElementById(id); }

    function setVerdict(text, good) {
        $("verdict").textContent = text;
        $("verdict").className = text ? (good ? "ok" : "bad") : "";
    }

    function updateHUD() {
        $("hudPhase").textContent = state.phase + 1;
        $("hudLives").textContent = state.lives;
        $("hudXP").textContent = state.xp;
    }

    function clearedPhases() {

        if (!window.HackoStore || !HackoStore.isLoggedIn()) {
            return [];
        }

        return HackoStore.mission(MISSION).levelsDone || [];
    }

    function renderPhaseSelect() {

        var box = $("phaseSelect");
        var done = clearedPhases();

        var furthest = done.length ? Math.max.apply(null, done) : -1;

        box.innerHTML = "";

        PHASES.forEach(function (phase, index) {

            var button = document.createElement("button");

            button.type = "button";
            button.textContent = index + 1;
            button.title = "Phase " + (index + 1) + " - " + phase.title +
                " (" + tierOf(index).name + ")";
            button.classList.add("tier-" + tierOf(index).name.toLowerCase());

            if (done.indexOf(index) !== -1) {
                button.classList.add("done");
            }

            if (index === state.phase) {
                button.classList.add("current");
            }

            button.disabled = !(index <= furthest + 1 || index <= state.phase);

            button.addEventListener("click", function () {

                if (index !== state.phase) {
                    HackoAudio.play("select");
                    loadPhase(index);
                }
            });

            box.appendChild(button);
        });
    }

    /* The whole point of the while phases: the numbers move,
       so a hardcoded count cannot survive a second attempt. */
    function rollAttack() {

        var phase = PHASES[state.phase];

        state.vars = phase.setup();
        state.expected = phase.expected(state.vars);

        renderVars();
    }

    function renderVars() {

        var box = $("vars");
        box.innerHTML = "";

        Object.keys(state.vars).forEach(function (name) {

            var chip = document.createElement("span");

            chip.className = "var";
            chip.textContent = "int " + name + " = " + state.vars[name] + ";";

            box.appendChild(chip);
        });
    }

    function attackBeats() {
        return state.expected.split("\n");
    }


    /* =====================================================
       THE BATTLEFIELD

       The client wanted this to play like an Iron Dome
       intercept. The Loop Master launches one slow missile
       per blow, each tagged with the counter it needs, and
       the slow flight is the time you get to write the loop.

       Every line your code prints launches one interceptor,
       in order - line 1 at missile #1, line 2 at #2 - and an
       interceptor only stops a missile whose tag it matches.
       A missing line, a wrong word or an extra one is
       something you watch happen in the sky.
    ===================================================== */

    /* seconds before the first missile lands, per phase */
    var FLIGHT = [50, 50, 70, 70, 70, 80, 80, 100, 100, 120];

    /* Client request: the boss is the biggest challenge of the
       whole game, so its phases come in three tiers - and the
       harder tiers fire faster missiles, not just a new label. */
    var TIERS = [
        { name: "MEDIUM", upTo: 2, speed: 1, note: "" },
        { name: "HARD", upTo: 6, speed: 0.9, note: "Missiles fly 10% faster." },
        { name: "EXTREME", upTo: 9, speed: 0.8, note: "Missiles fly 20% faster." }
    ];

    function tierOf(phase) {
        return TIERS.filter(function (tier) { return phase <= tier.upTo; })[0];
    }

    function flightTime(phase) {
        return Math.round(FLIGHT[phase] * tierOf(phase).speed);
    }
    var LAUNCH_GAP = 1.5;
    var SHOT_TIME = 1.1;

    var W = 800;
    var H = 340;
    var GROUND = 312;
    var MUZZLE = { x: 128, y: 192 };
    var DOME = { x: 715, r: 78 };
    var PAD = { x: 752, y: 276 };

    var TAG = {
        BLOCK: "#ff7b7b", DODGE: "#ffb347", STRIKE: "#c98bff",
        HOLD: "#45f3ff", ENDURE: "#ffd34e"
    };

    var canvas = $("field");
    var ctx = canvas.getContext("2d");

    var heroImg = new Image();
    heroImg.src = "hacko.png";

    var sky = {
        mode: "ready",
        missiles: [],
        shots: [],
        booms: [],
        smoke: [],
        lines: [],
        fired: false,
        rushed: false,
        timedOut: false,
        shake: 0,
        domeHit: 0,
        bossHit: 0,
        volley: 0
    };

    var stars = [];
    var skyline = [];

    (function () {
        for (var i = 0; i < 70; i++) {
            stars.push({
                x: Math.random() * W,
                y: Math.random() * (GROUND - 90),
                r: Math.random() < 0.15 ? 1.6 : 0.9,
                tw: Math.random() * 6
            });
        }

        for (var x = 150; x < 620; x += 22 + Math.random() * 18) {
            skyline.push({ x: x, w: 16 + Math.random() * 22, h: 20 + Math.random() * 55 });
        }
    }());

    function clock() {
        return performance.now() / 1000;
    }

    function bez(a, c, b, p) {
        var q = 1 - p;
        return q * q * a + 2 * q * p * c + p * p * b;
    }


    /* ---------- missiles ---------- */

    function launchVolley() {

        var t = clock() + 0.6;
        var flight = flightTime(state.phase);

        sky.missiles = attackBeats().map(function (move, i) {

            /* land on the dome's surface, spread across it */
            var tx = DOME.x - 62 + (i % 5) * 16;
            var dx = tx - DOME.x;

            return {
                i: i,
                move: move,
                launch: t + i * LAUNCH_GAP,
                land: t + i * LAUNCH_GAP + flight,
                tier: i % 3,
                tx: tx,
                ty: GROUND - Math.sqrt(DOME.r * DOME.r - dx * dx),
                launched: false,
                dead: false,
                landed: false,
                rush: null
            };
        });

        sky.shots = [];
        sky.lines = [];
        sky.fired = false;
        sky.rushed = false;
        sky.timedOut = false;
        sky.mode = "incoming";

        $("runBtn").disabled = false;
        $("callout").textContent = "INCOMING - write the loop, then FIRE";
    }

    function progress(m, t) {

        if (m.rush) {
            return Math.min(1, m.rush.p0 + (1 - m.rush.p0) * (t - m.rush.t0) / 1.3);
        }

        return Math.max(0, Math.min(1, (t - m.launch) / (m.land - m.launch)));
    }

    /* three arc heights so a long volley fans out instead
       of stacking its labels on one line */
    function missileAt(m, p) {
        return {
            x: bez(MUZZLE.x, 330 + m.tier * 50, m.tx, p),
            y: bez(MUZZLE.y, [-70, 10, 90][m.tier], m.ty, p)
        };
    }

    function aliveCount() {
        return sky.missiles.filter(function (m) {
            return !m.dead && !m.landed;
        }).length;
    }

    function updateBossBar() {

        var n = sky.missiles.length || 1;
        var down = sky.missiles.filter(function (m) { return m.dead; }).length;

        $("bossHP").style.width = Math.round(100 - (down / n) * 100) + "%";
    }


    /* ---------- interceptors ---------- */

    function fireInterceptors(lines) {

        var t = clock();

        sky.fired = true;
        sky.lines = lines;

        lines.forEach(function (text, j) {

            var m = sky.missiles[j] || null;
            var go = t + 0.25 + j * 0.35;

            /* cannot aim at a missile that has not left yet */
            if (m) {
                go = Math.max(go, m.launch + 0.3);
            }

            sky.shots.push({
                j: j,
                text: text,
                target: m,
                go: go,
                arrive: go + SHOT_TIME,
                launched: false,
                done: false,
                missed: false
            });
        });

        $("runBtn").disabled = true;
        $("callout").textContent = lines.length + " interceptor" +
            (lines.length === 1 ? "" : "s") + " away";
    }

    function shotAim(s) {

        if (!s.target) {
            /* extra lines have nothing to hit - they sail off */
            return { x: 380 + (s.j % 6) * 40, y: -40 };
        }

        return missileAt(s.target, progress(s.target, s.arrive));
    }

    function shotAt(s, p) {

        var aim = shotAim(s);

        return {
            x: bez(PAD.x, PAD.x - 90, aim.x, p),
            y: bez(PAD.y, Math.min(PAD.y, aim.y) - 70, aim.y, p)
        };
    }

    function resolveShot(s) {

        s.done = true;

        var m = s.target;
        var at = shotAt(s, 1);

        if (m && !m.dead && !m.landed && s.text === m.move) {

            m.dead = true;
            sky.bossHit = 0.3;
            boom(at.x, at.y, "#b6ff9e", 26);
            HackoAudio.play("pickup");
            updateBossBar();
            return;
        }

        s.missed = true;
        boom(at.x, at.y, m ? "#ff496f" : "#6f8aa0", 12);
        HackoAudio.play("wrong");
    }


    /* ---------- effects ---------- */

    function boom(x, y, color, size) {
        sky.booms.push({ x: x, y: y, color: color, size: size, t0: clock() });
    }

    function puff(x, y) {

        if (sky.smoke.length > 500) {
            sky.smoke.shift();
        }

        sky.smoke.push({
            x: x + (Math.random() - 0.5) * 3,
            y: y + (Math.random() - 0.5) * 3,
            t0: clock()
        });
    }


    /* ---------- simulation ---------- */

    var lastPuff = 0;

    function step(t) {

        if (sky.mode !== "incoming") {
            return;
        }

        var puffNow = t - lastPuff > 0.05;

        if (puffNow) {
            lastPuff = t;
        }

        sky.missiles.forEach(function (m) {

            if (!m.launched && t >= m.launch) {
                m.launched = true;
                boom(MUZZLE.x, MUZZLE.y, "#ff9b5c", 10);
                HackoAudio.play("launch");
            }

            if (!m.launched || m.dead || m.landed) {
                return;
            }

            var p = progress(m, t);
            var at = missileAt(m, p);

            if (puffNow) {
                puff(at.x, at.y);
            }

            if (p >= 1) {
                m.landed = true;
                sky.shake = 14;
                sky.domeHit = 0.6;
                boom(at.x, at.y, "#ffb347", 38);
                HackoAudio.play("boom");
            }
        });

        sky.shots.forEach(function (s) {

            if (!s.launched && t >= s.go) {
                s.launched = true;
                HackoAudio.play("zap");
            }

            if (s.launched && !s.done && t >= s.arrive) {
                resolveShot(s);
            }
        });

        /* too slow: the first missile landed before FIRE */
        if (!sky.fired && sky.missiles.some(function (m) { return m.landed; })) {
            sky.fired = true;
            sky.timedOut = true;
            $("runBtn").disabled = true;
        }

        var shotsDone = sky.shots.every(function (s) { return s.done; });

        /* once every interceptor has had its chance, whatever is
           still flying comes down fast - no waiting a minute to
           see the result */
        if (sky.fired && shotsDone && !sky.rushed) {

            sky.rushed = true;

            sky.missiles.forEach(function (m) {
                if (!m.dead && !m.landed) {
                    m.launched = true;
                    m.rush = { p0: progress(m, t), t0: t };
                }
            });
        }

        if (sky.rushed && aliveCount() === 0) {
            sky.mode = "over";

            var volley = sky.volley;

            window.setTimeout(function () {
                if (volley === sky.volley) {
                    endVolley();
                }
            }, 900);
        }
    }


    /* ---------- drawing ---------- */

    function drawBackdrop(t) {

        var g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, "#050b18");
        g.addColorStop(0.7, "#171031");
        g.addColorStop(1, "#2a1230");
        ctx.fillStyle = g;
        ctx.fillRect(-20, -20, W + 40, H + 40);

        stars.forEach(function (s) {
            ctx.globalAlpha = 0.45 + 0.4 * Math.sin(t * 1.4 + s.tw);
            ctx.fillStyle = "#dfefff";
            ctx.fillRect(s.x, s.y, s.r, s.r);
        });

        ctx.globalAlpha = 1;
        ctx.fillStyle = "#0e1a2d";

        skyline.forEach(function (b) {
            ctx.fillRect(b.x, GROUND - b.h, b.w, b.h);
        });

        ctx.fillStyle = "#0b1726";
        ctx.fillRect(-20, GROUND, W + 40, H - GROUND + 20);
        ctx.fillStyle = "#2d6580";
        ctx.fillRect(-20, GROUND, W + 40, 2);
    }

    /* Client request: the Loop Master was a tower with an eye.
       It is a Big Boss Robot now - standing at the back firing
       its shoulder cannon in phases 1-9, and walking in to fight
       Hacko itself in phase 10. cx is its centre, feet on the
       ground. */
    function drawRobot(cx, t, walking) {

        var hit = sky.bossHit > 0;
        var beaten = state.won;
        var edge = beaten ? "#91ff6f" : (hit ? "#ffffff" : "#ff3d68");
        var step = walking ? Math.sin(t * 7) : 0;
        var bob = walking ? Math.abs(step) * 3 : Math.sin(t * 2) * 1.5;

        ctx.save();
        ctx.translate(0, -bob);
        ctx.lineWidth = 2;
        ctx.strokeStyle = edge;

        /* legs */
        [-1, 1].forEach(function (side) {
            var swing = step * 7 * side;
            ctx.fillStyle = "#2b3242";
            ctx.fillRect(cx + side * 17 - 9 + swing, 262, 18, GROUND - 262 + bob - 6);
            ctx.strokeRect(cx + side * 17 - 9 + swing, 262, 18, GROUND - 262 + bob - 6);
            ctx.fillStyle = "#3d4558";
            ctx.fillRect(cx + side * 17 - 13 + swing, GROUND + bob - 10, 26, 10);
            ctx.strokeRect(cx + side * 17 - 13 + swing, GROUND + bob - 10, 26, 10);
        });

        /* torso */
        var g = ctx.createLinearGradient(cx - 44, 0, cx + 44, 0);
        g.addColorStop(0, beaten ? "#1f2f26" : "#3a2233");
        g.addColorStop(0.5, beaten ? "#2f4a3a" : "#5a3048");
        g.addColorStop(1, beaten ? "#1f2f26" : "#2a1726");
        ctx.fillStyle = g;
        ctx.fillRect(cx - 44, 180, 88, 86);
        ctx.strokeRect(cx - 44, 180, 88, 86);

        /* shoulders */
        ctx.fillStyle = "#4a2a3e";
        ctx.fillRect(cx - 56, 178, 18, 22);
        ctx.strokeRect(cx - 56, 178, 18, 22);
        ctx.fillRect(cx + 38, 178, 18, 22);
        ctx.strokeRect(cx + 38, 178, 18, 22);

        /* left arm swings while walking */
        ctx.save();
        ctx.translate(cx - 48, 196);
        ctx.rotate(walking ? step * 0.35 : 0.08);
        ctx.fillStyle = "#2b3242";
        ctx.fillRect(-7, 0, 14, 52);
        ctx.strokeRect(-7, 0, 14, 52);
        ctx.fillStyle = "#3d4558";
        ctx.fillRect(-10, 50, 20, 14);
        ctx.strokeRect(-10, 50, 20, 14);
        ctx.restore();

        /* shoulder cannon - the missiles leave from its tip */
        ctx.save();
        ctx.translate(cx + 40, 204);
        ctx.rotate(walking ? -0.15 : -0.5);
        ctx.fillStyle = "#3b1528";
        ctx.fillRect(0, -8, 26, 16);
        ctx.strokeRect(0, -8, 26, 16);
        ctx.fillStyle = "#ff9b5c";
        ctx.fillRect(24, -5, 4, 10);
        ctx.restore();

        /* chest core, with the loop it is named for */
        var pulse = 0.55 + 0.45 * Math.sin(t * 4);
        ctx.fillStyle = beaten ? "#91ff6f" : "rgba(255,40,80," + pulse + ")";
        ctx.shadowBlur = beaten ? 8 : 18;
        ctx.shadowColor = beaten ? "#91ff6f" : "#ff2850";
        ctx.beginPath();
        ctx.arc(cx, 218, 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#1a0710";
        ctx.font = "900 18px Orbitron, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(beaten ? "✓" : "∞", cx, 225);

        /* belt of rivets */
        ctx.fillStyle = "#ffc2ce";
        for (var r = -32; r <= 32; r += 16) {
            ctx.fillRect(cx + r - 2, 252, 4, 4);
        }

        /* head */
        ctx.fillStyle = "#3a2233";
        ctx.fillRect(cx - 26, 140, 52, 38);
        ctx.strokeRect(cx - 26, 140, 52, 38);
        ctx.fillStyle = "#12060c";
        ctx.fillRect(cx - 20, 150, 40, 14);

        /* visor eye scans side to side */
        var eye = Math.sin(t * 2.4) * 12;
        ctx.fillStyle = beaten ? "#91ff6f" : "#ff2850";
        ctx.shadowBlur = 12;
        ctx.shadowColor = ctx.fillStyle;
        ctx.fillRect(cx - 6 + eye, 153, 12, 8);
        ctx.shadowBlur = 0;

        /* jaw grille */
        ctx.strokeStyle = "rgba(255,194,206,.55)";
        ctx.lineWidth = 1;
        for (var j = -14; j <= 14; j += 7) {
            ctx.beginPath();
            ctx.moveTo(cx + j, 168);
            ctx.lineTo(cx + j, 175);
            ctx.stroke();
        }

        /* antenna */
        ctx.strokeStyle = edge;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(cx, 140);
        ctx.lineTo(cx, 126);
        ctx.stroke();
        ctx.fillStyle = Math.floor(t * 3) % 2 ? "#ff3d68" : "#ffd34e";
        ctx.beginPath();
        ctx.arc(cx, 123, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.font = "700 9px Orbitron, sans-serif";
        ctx.fillStyle = "#ffc2ce";
        ctx.fillText("LOOP MASTER", cx, 114);

        ctx.restore();
    }

    function drawBase() {

        /* bunker and launcher */
        ctx.fillStyle = "#12324a";
        ctx.fillRect(736, 284, 52, GROUND - 284);
        ctx.strokeStyle = "#45f3ff";
        ctx.lineWidth = 1.5;
        ctx.strokeRect(736, 284, 52, GROUND - 284);

        ctx.save();
        ctx.translate(PAD.x + 6, PAD.y + 10);
        ctx.rotate(-2.2);
        ctx.fillStyle = "#1d5575";
        ctx.fillRect(0, -5, 20, 10);
        ctx.strokeRect(0, -5, 20, 10);
        ctx.restore();

        /* Hacko on guard */
        if (heroImg.complete && heroImg.naturalWidth) {
            ctx.drawImage(heroImg, 668, GROUND - 50, 37, 50);
        }

        /* the dome */
        var red = sky.domeHit > 0;

        ctx.beginPath();
        ctx.arc(DOME.x, GROUND, DOME.r, Math.PI, 0);
        ctx.fillStyle = red ? "rgba(255,73,111,0.22)" : "rgba(69,243,255,0.07)";
        ctx.fill();
        ctx.strokeStyle = red ? "#ff496f" : "rgba(69,243,255,0.75)";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(DOME.x, GROUND, DOME.r - 7, Math.PI, 0);
        ctx.strokeStyle = red ? "rgba(255,73,111,0.4)" : "rgba(69,243,255,0.25)";
        ctx.lineWidth = 1;
        ctx.stroke();
    }

    function drawSmoke(t) {

        sky.smoke = sky.smoke.filter(function (s) {
            return t - s.t0 < 1.6;
        });

        sky.smoke.forEach(function (s) {
            var age = (t - s.t0) / 1.6;
            ctx.fillStyle = "rgba(170,170,190," + (0.28 * (1 - age)) + ")";
            ctx.beginPath();
            ctx.arc(s.x, s.y - age * 6, 2 + age * 6, 0, Math.PI * 2);
            ctx.fill();
        });
    }

    function label(text, x, y, color) {

        ctx.font = "700 10px Consolas, monospace";
        ctx.textAlign = "center";

        var w = ctx.measureText(text).width + 8;

        ctx.fillStyle = "rgba(5,10,20,0.82)";
        ctx.fillRect(x - w / 2, y - 11, w, 14);
        ctx.strokeStyle = color;
        ctx.lineWidth = 1;
        ctx.strokeRect(x - w / 2, y - 11, w, 14);
        ctx.fillStyle = color;
        ctx.fillText(text, x, y);
    }

    function drawMissiles(t) {

        sky.missiles.forEach(function (m) {

            if (!m.launched || m.dead || m.landed) {
                return;
            }

            var p = progress(m, t);
            var a = missileAt(m, p);
            var b = missileAt(m, Math.min(1, p + 0.01));
            var angle = Math.atan2(b.y - a.y, b.x - a.x);

            ctx.save();
            ctx.translate(a.x, a.y);
            ctx.rotate(angle);

            /* flame */
            ctx.fillStyle = Math.random() < 0.5 ? "#ffb347" : "#ff6a3d";
            ctx.beginPath();
            ctx.moveTo(-9, -3);
            ctx.lineTo(-17 - Math.random() * 6, 0);
            ctx.lineTo(-9, 3);
            ctx.fill();

            /* body, nose, fins */
            ctx.fillStyle = "#d9dde3";
            ctx.fillRect(-9, -3, 16, 6);
            ctx.fillStyle = "#ff3d68";
            ctx.beginPath();
            ctx.moveTo(7, -3);
            ctx.lineTo(13, 0);
            ctx.lineTo(7, 3);
            ctx.fill();
            ctx.fillRect(-9, -6, 4, 12);

            ctx.restore();

            label("#" + (m.i + 1) + " " + m.move, a.x, a.y - 12, TAG[m.move] || "#ff7b7b");
        });
    }

    function drawShots(t) {

        sky.shots.forEach(function (s) {

            if (!s.launched || s.done) {
                return;
            }

            var p = Math.min(1, (t - s.go) / SHOT_TIME);
            var a = shotAt(s, p);
            var back = shotAt(s, Math.max(0, p - 0.08));

            ctx.strokeStyle = "rgba(69,243,255,0.7)";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(back.x, back.y);
            ctx.lineTo(a.x, a.y);
            ctx.stroke();

            ctx.fillStyle = "#eaffff";
            ctx.beginPath();
            ctx.arc(a.x, a.y, 3, 0, Math.PI * 2);
            ctx.fill();

            label(s.text, a.x, a.y + 18, "#45f3ff");
        });
    }

    function drawBooms(t) {

        sky.booms = sky.booms.filter(function (b) {
            return t - b.t0 < 0.7;
        });

        sky.booms.forEach(function (b) {

            var age = (t - b.t0) / 0.7;

            ctx.globalAlpha = 1 - age;
            ctx.fillStyle = b.color;
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.size * (0.3 + age * 0.7), 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.size * (0.5 + age), 0, Math.PI * 2);
            ctx.stroke();
        });

        ctx.globalAlpha = 1;
    }

    function drawClock(t) {

        var el = $("clock");

        if (finale.active) {
            var secs = Math.max(0, Math.ceil((ROBOT_CONTACT - finale.x) / robotSpeed()));
            el.textContent = finale.walking ? "CONTACT IN " + secs + "s" : "";
            el.className = "clock" + (finale.walking && secs <= 15 ? " urgent" : "");
            return;
        }

        if (sky.mode !== "incoming" || sky.fired) {
            el.textContent = sky.mode === "incoming" ? "INTERCEPTORS AWAY" : "";
            el.className = "clock";
            return;
        }

        var next = Infinity;

        sky.missiles.forEach(function (m) {
            if (!m.dead && !m.landed) {
                next = Math.min(next, m.land);
            }
        });

        var left = Math.max(0, Math.ceil(next - t));

        el.textContent = "IMPACT IN " + left + "s";
        el.className = "clock" + (left <= 10 ? " urgent" : "");
    }

    var lastFrame = 0;

    function frame() {

        var t = clock();
        var dt = lastFrame ? t - lastFrame : 0.016;

        lastFrame = t;

        step(t);
        stepFinale(t, dt);

        sky.domeHit = Math.max(0, sky.domeHit - dt);
        sky.bossHit = Math.max(0, sky.bossHit - dt);

        ctx.save();

        if (sky.shake > 0.5) {
            ctx.translate((Math.random() - 0.5) * sky.shake,
                (Math.random() - 0.5) * sky.shake);
            sky.shake *= 0.88;
        } else {
            sky.shake = 0;
        }

        drawBackdrop(t);
        drawRobot(finale.active ? finale.x : 66, t, finale.active && finale.walking);
        drawBase();
        drawSmoke(t);

        if (finale.active) {
            drawFinale(t);
        } else {
            drawMissiles(t);
            drawShots(t);
        }

        drawBooms(t);

        ctx.restore();

        drawClock(t);
        window.requestAnimationFrame(frame);
    }

    window.requestAnimationFrame(frame);


    /* ---------- ready screen between volleys ---------- */

    function showReady(title, text, button) {

        sky.volley += 1;
        sky.mode = "ready";
        sky.missiles = [];
        sky.shots = [];
        finale.walking = false;

        $("runBtn").disabled = true;
        $("overlayTitle").textContent = title;
        $("overlayText").textContent = text;
        $("startBtn").textContent = button || "START";
        $("startBtn").classList.toggle("hidden", button === false);
        $("overlay").classList.remove("hidden");
    }

    $("startBtn").addEventListener("click", function () {

        if (sky.mode !== "ready") {
            return;
        }

        HackoAudio.play("select");
        $("overlay").classList.add("hidden");

        if (finale.active) {
            startWalking();
        } else {
            launchVolley();
        }

        $("editor").focus();
    });


    /* ---------- phases ---------- */

    function loadPhase(index) {

        state.phase = Math.max(0, Math.min(index, PHASES.length - 1));
        state.won = false;

        /* Client rule: three lives per phase, not per mission. */
        state.lives = 3;

        var phase = PHASES[state.phase];

        finale.active = !!phase.finale;
        finale.walking = false;

        if (!phase.finale) {

            /* each hint tier costs a hint point - see shared/hint.js */
            hint = HackoHint.paid({
                id: "m10-l" + (state.phase + 1),
                tiers: phase.hints
            });

            $("hintBtn").textContent = hint.label();

            rollAttack();
        }

        $("duel").classList.remove("won");
        $("bossFace").innerHTML = "&#129302;";
        $("bossName").textContent = phase.name;
        $("bossHP").style.width = "100%";
        $("bossQuote").textContent = "“" + phase.quote + "”";
        $("brief").textContent = phase.brief;
        $("phaseTitle").textContent =
            "PHASE " + (state.phase + 1) + " - " + phase.title;

        var tier = tierOf(state.phase).name;

        $("hudTier").textContent = tier;
        $("hudTier").className = "tier tier-" + tier.toLowerCase();
        $("duel").className = "duel tier-" + tier.toLowerCase();
        $("editor").value = phase.starter || "";
        $("callout").textContent = "";

        setVerdict("", true);
        renderPhaseSelect();
        updateHUD();

        if (phase.finale) {
            startFinale();
            return;
        }

        showReady(
            "PHASE " + (state.phase + 1) + " - " + phase.title,
            tierOf(state.phase).name + " - " +
            attackBeats().length + " missile" +
            (attackBeats().length === 1 ? "" : "s") + " loading. " +
            (tierOf(state.phase).note ? tierOf(state.phase).note + " " : "They are slow - ") +
            flightTime(state.phase) + " seconds to impact. Every line your code " +
            "prints fires one interceptor: line 1 at missile #1, line 2 at #2. " +
            "An interceptor only stops a missile whose tag it matches."
        );
    }


    /* =====================================================
       FINALE

       Phase 10. The Loop Master robot walks from the back of
       the field toward Hacko's dome - the walk is the clock.
       The player works through FINALE rounds one after
       another without stopping:

         right output  Hacko blasts it: -1 life on its bar,
                       and it is knocked back
         wrong output  it charges forward, and any numbers
                       re-roll so a hardcoded guess cannot
                       simply be fired again
         compile error costs nothing but the time

       If it reaches the dome Hacko loses a life and it goes
       back to the start - its damage stays. Five hits and it
       falls.
    ===================================================== */

    var ROBOT_HOME = 70;
    var ROBOT_CONTACT = 585;
    var WALK_TIME = 120;
    var KNOCKBACK = 0.45;
    var LUNGE = 30;

    var finale = {
        active: false,
        walking: false,
        round: 0,
        hp: 0,
        x: ROBOT_HOME,
        busy: false,
        beam: 0,
        smashed: 0
    };

    function robotSpeed() {
        return (ROBOT_CONTACT - ROBOT_HOME) / WALK_TIME;
    }

    function finaleRounds() {
        return PHASES[state.phase].rounds;
    }

    function updateRobotHP() {
        var max = finaleRounds().length;
        $("bossHP").style.width = Math.round(finale.hp / max * 100) + "%";
        $("bossName").textContent = "THE LOOP MASTER - " + finale.hp + "/" + max + " HP";
    }

    function loadRound(index, keepCode) {

        var rounds = finaleRounds();
        var round = rounds[index];

        finale.round = index;

        state.vars = round.setup();
        state.expected = round.expected(state.vars);
        renderVars();

        $("brief").textContent = "ROUND " + (index + 1) + "/" + rounds.length +
            " - " + round.title + ": " + round.brief;
        $("phaseTitle").textContent = "PHASE 10 - ROUND " + (index + 1) +
            "/" + rounds.length + ": " + round.title;

        if (!keepCode) {
            $("editor").value = round.starter;
        }

        hint = HackoHint.paid({
            id: "m10-l10-r" + (index + 1),
            tiers: round.hints
        });

        $("hintBtn").textContent = hint.label();
    }

    function startFinale() {

        finale.hp = finaleRounds().length;
        finale.x = ROBOT_HOME;
        finale.busy = false;
        finale.beam = 0;

        loadRound(0, false);
        updateRobotHP();

        showReady(
            "PHASE 10 - THE LOOP MASTER",
            "EXTREME - no more missiles: the Loop Master robot is coming for " +
            "Hacko itself. It walks toward the dome while you solve " +
            finaleRounds().length + " loop challenges in a row. Every program " +
            "that prints the right output blasts it (-1 life) and knocks it back. " +
            "A wrong output makes it charge. If it reaches the dome, you lose a life.",
            "FIGHT"
        );
    }

    function startWalking() {
        sky.mode = "finale";
        finale.walking = true;
        $("runBtn").disabled = false;
        $("callout").textContent = "THE LOOP MASTER IS COMING - KEEP CODING";
    }

    function stepFinale(t, dt) {

        finale.beam = Math.max(0, finale.beam - dt);
        finale.smashed = Math.max(0, finale.smashed - dt);

        if (!finale.active || !finale.walking) {
            return;
        }

        /* the briefing holds frames, so dt can be large once -
           never let one frame carry it across the field */
        finale.x += robotSpeed() * Math.min(dt, 0.1);

        if (finale.x >= ROBOT_CONTACT) {
            robotReachesDome();
        }
    }

    function drawFinale(t) {

        /* life bar over its head */
        var max = finaleRounds().length;
        var w = 96;
        var x0 = finale.x - w / 2;

        ctx.fillStyle = "rgba(5,10,20,.85)";
        ctx.fillRect(x0 - 3, 88, w + 6, 16);

        for (var i = 0; i < max; i++) {
            var seg = (w - (max - 1) * 3) / max;
            ctx.fillStyle = i < finale.hp ? "#ff3d68" : "#3a2233";
            ctx.fillRect(x0 + i * (seg + 3), 91, seg, 10);
        }

        ctx.strokeStyle = "#ffc2ce";
        ctx.lineWidth = 1;
        ctx.strokeRect(x0 - 3, 88, w + 6, 16);

        /* Hacko's blast */
        if (finale.beam > 0) {
            var a = finale.beam / 0.4;
            ctx.save();
            ctx.globalAlpha = Math.min(1, a * 1.5);
            ctx.shadowBlur = 24;
            ctx.shadowColor = "#45f3ff";
            ctx.strokeStyle = "#bffcff";
            ctx.lineWidth = 3 + a * 9;
            ctx.beginPath();
            ctx.moveTo(682, GROUND - 32);
            ctx.lineTo(finale.x + 10, 218);
            ctx.stroke();
            ctx.restore();
        }

        /* how close it is - a red tint on the dome as it nears */
        var near = (finale.x - ROBOT_HOME) / (ROBOT_CONTACT - ROBOT_HOME);

        if (finale.walking && near > 0.7) {
            ctx.save();
            ctx.globalAlpha = (near - 0.7) / 0.3 * (0.5 + 0.5 * Math.sin(t * 8));
            ctx.strokeStyle = "#ff3d68";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(DOME.x, GROUND, DOME.r + 4, Math.PI, 0);
            ctx.stroke();
            ctx.restore();
        }
    }

    function sameLines(mine, want) {
        return mine.length === want.length &&
            mine.every(function (line, i) { return line === want[i]; });
    }

    function explainMiss(mine, want) {

        for (var i = 0; i < Math.max(mine.length, want.length); i++) {
            if (mine[i] !== want[i]) {
                if (mine[i] === undefined) {
                    return "Your program stopped after " + mine.length + " line" +
                        (mine.length === 1 ? "" : "s") + " - line " + (i + 1) +
                        " should be " + want[i] + ".";
                }
                if (want[i] === undefined) {
                    return "Your program printed " + mine.length + " lines but only " +
                        want.length + " were needed - line " + (i + 1) + " is extra.";
                }
                return "Line " + (i + 1) + " should be " + want[i] +
                    " but your program printed " + mine[i] + ".";
            }
        }

        return "";
    }

    function finaleFight() {

        if (!finale.walking) {
            setVerdict("Press FIGHT - the Loop Master is not moving yet.", false);
            return;
        }

        if (finale.busy) {
            return;
        }

        var preamble = Object.keys(state.vars).map(function (name) {
            return "int " + name + " = " + state.vars[name] + ";";
        }).join("\n");

        var result = HackoJava.run(preamble + "\n" + $("editor").value);

        if (result.error) {
            setVerdict("Your program did not compile - fix it, it is still coming:\n" +
                result.error, false);
            HackoAudio.play("wrong");
            return;
        }

        var mine = result.output
            .replace(/\s+$/, "")
            .split("\n")
            .map(function (line) { return line.trim(); })
            .filter(function (line) { return line.length; });

        var want = state.expected.split("\n");

        if (sameLines(mine, want)) {
            hitRobot();
            return;
        }

        /* a miss: it charges, and the numbers move */
        var why = explainMiss(mine, want);
        var before = JSON.stringify(state.vars);

        finale.x = Math.min(ROBOT_CONTACT - 1, finale.x + LUNGE);
        sky.shake = 6;
        HackoAudio.play("wrong");
        $("callout").textContent = "MISS - THE LOOP MASTER CHARGES";

        var round = finaleRounds()[finale.round];
        state.vars = round.setup();
        state.expected = round.expected(state.vars);
        renderVars();

        setVerdict(why + (JSON.stringify(state.vars) !== before
            ? "\nThe numbers above have changed - check them again."
            : ""), false);
    }

    function hitRobot() {

        finale.busy = true;
        finale.beam = 0.4;
        HackoAudio.play("zap");
        setVerdict("Direct hit!", true);

        window.setTimeout(function () {

            if (!finale.active) {
                return;
            }

            finale.hp -= 1;
            sky.bossHit = 0.4;
            sky.shake = 12;
            boom(finale.x, 210, "#b6ff9e", 40);
            HackoAudio.play("boom");

            state.xp += 20;
            updateHUD();
            updateRobotHP();

            finale.x = Math.max(ROBOT_HOME,
                finale.x - (ROBOT_CONTACT - ROBOT_HOME) * KNOCKBACK);

            finale.busy = false;

            if (finale.hp <= 0) {
                finale.walking = false;
                $("runBtn").disabled = true;
                victory();
                return;
            }

            $("callout").textContent = "HIT! " + finale.hp + " TO GO - NEXT CHALLENGE";
            setVerdict("Direct hit! It staggers back. Round " + (finale.round + 2) +
                " is in the editor - keep going.", true);
            loadRound(finale.round + 1, false);
            $("editor").focus();
        }, 380);
    }

    function robotReachesDome() {

        finale.walking = false;
        finale.x = ROBOT_CONTACT;
        finale.smashed = 0.8;
        sky.shake = 18;
        sky.domeHit = 0.8;
        boom(DOME.x - DOME.r + 10, GROUND - 40, "#ffb347", 46);
        HackoAudio.play("boom");

        state.lives -= 1;
        updateHUD();

        if (state.lives > 0) {

            HackoAudio.play("hit");
            $("callout").textContent = "THE DOME IS SMASHED";

            window.setTimeout(function () {

                finale.x = ROBOT_HOME;

                /* same challenge, fresh numbers; the player's code stays */
                loadRound(finale.round, true);

                showReady(
                    "THE DOME IS SMASHED - " + state.lives + " " +
                        (state.lives === 1 ? "LIFE" : "LIVES") + " LEFT",
                    "The Loop Master reached Hacko. It keeps its damage (" +
                        finale.hp + "/" + finaleRounds().length + " HP) and walks " +
                        "in again from the back. Check the numbers above - they may " +
                        "have changed.",
                    "KEEP FIGHTING"
                );
            }, 900);
            return;
        }

        /* Client rule: out of lives drops back one phase. */
        state.lives = 3;
        state.xp = Math.max(0, state.xp - 100);

        var back = window.HackoStore
            ? HackoStore.loseAllLives(MISSION, state.phase)
            : Math.max(0, state.phase - 1);

        HackoAudio.play("gameover");
        $("callout").textContent = "HACKO FALLS";

        window.setTimeout(function () {
            loadPhase(back);
            $("overlayTitle").textContent = "OUT OF LIVES - BACK TO PHASE " + (back + 1);
        }, 1200);
    }


    function fight() {

        if (state.won) {
            return;
        }

        if (finale.active) {
            finaleFight();
            return;
        }

        if (sky.mode !== "incoming" || sky.fired) {
            setVerdict(sky.mode === "ready"
                ? "Nothing is in the air yet - press START."
                : "Your interceptors are already away.", false);
            return;
        }

        /* the boss's numbers reach the player's code as
           ordinary declared variables */
        var preamble = Object.keys(state.vars).map(function (name) {
            return "int " + name + " = " + state.vars[name] + ";";
        }).join("\n");

        var result = HackoJava.run(preamble + "\n" + $("editor").value);

        /* a compile error costs nothing but time - the missiles
           keep coming while you fix it */
        if (result.error) {
            setVerdict("Your plan did not compile - fix it, the missiles are still coming:\n" +
                result.error, false);
            HackoAudio.play("wrong");
            return;
        }

        var mine = result.output
            .replace(/\s+$/, "")
            .split("\n")
            .map(function (line) { return line.trim(); })
            .filter(function (line) { return line.length; });

        setVerdict("", true);
        fireInterceptors(mine);
    }

    /* every missile is down or has landed - judge the volley */
    function endVolley() {

        var beats = attackBeats();
        var lines = sky.lines;
        var landed = sky.missiles.filter(function (m) { return m.landed; });
        var extra = Math.max(0, lines.length - beats.length);

        if (!landed.length && !extra) {
            victory();
            return;
        }

        var why;

        if (sky.timedOut) {
            why = "Too slow - the volley landed before you fired. " +
                "Write the loop while the missiles fly, then FIRE.";
        } else if (!lines.length) {
            why = "Your plan printed nothing, so no interceptor launched.\n" +
                "A loop whose condition is false from the start never runs " +
                "its body even once.";
        } else if (!landed.length) {
            why = "Every missile stopped, but you fired " + lines.length +
                " interceptors at " + beats.length + " missiles. The extra ones " +
                "crashed back down - tighten the loop.";
        } else {
            var k = landed[0].i;
            var got = lines[k];

            why = got === beats[k]
                ? "Missile #" + (k + 1) + " landed before your interceptor reached it - fire sooner."
                : "Missile #" + (k + 1) + " needed " + beats[k] + " and your line " +
                  (k + 1) + " was " + (got === undefined ? "missing" : got) + ".";
        }

        setVerdict(why, false);
        loseLife(why);
    }

    function loseLife(why) {

        state.lives -= 1;

        if (state.lives > 0) {

            updateHUD();
            HackoAudio.play("hit");
            $("callout").textContent = "THE DOME IS HIT";

            /* while phases re-roll their numbers here, so a
               hardcoded count cannot survive a second volley */
            rollAttack();
            $("bossHP").style.width = "100%";

            window.setTimeout(function () {
                showReady(
                    "DIRECT HIT - " + state.lives + " " +
                        (state.lives === 1 ? "LIFE" : "LIVES") + " LEFT",
                    why + "\n\nThe Loop Master is reloading. Check the numbers " +
                        "above - they may have changed.",
                    "NEXT VOLLEY"
                );
            }, 700);
            return;
        }

        /* Client rule: out of lives drops back one phase. */
        state.lives = 3;
        state.xp = Math.max(0, state.xp - 100);

        var back = window.HackoStore
            ? HackoStore.loseAllLives(MISSION, state.phase)
            : Math.max(0, state.phase - 1);

        HackoAudio.play("gameover");
        $("callout").textContent = "HACKO FALLS";

        window.setTimeout(function () {
            loadPhase(back);
            $("overlayTitle").textContent = "OUT OF LIVES - BACK TO PHASE " + (back + 1);
        }, 1200);
    }

    function victory() {

        state.won = true;
        state.xp += 100;

        $("duel").classList.add("won");
        $("bossFace").innerHTML = "&#10003;";
        $("bossHP").style.width = "0%";
        $("callout").textContent = finale.active
            ? "THE LOOP MASTER FALLS"
            : "EVERY MISSILE INTERCEPTED";

        /* the robot goes up */
        var at = finale.active ? finale.x : 66;

        for (var i = 0; i < (finale.active ? 10 : 6); i++) {
            boom(at - 45 + Math.random() * 90, 130 + Math.random() * 160,
                i % 2 ? "#ffb347" : "#b6ff9e", 30);
        }

        sky.shake = finale.active ? 18 : 10;

        setVerdict(finale.active
            ? "Five direct hits - the Loop Master is destroyed!"
            : "Every missile intercepted. Phase cleared.", true);
        HackoAudio.play("win");
        updateHUD();

        if (window.HackoStore) {
            HackoStore.completeLevel(MISSION, state.phase, 100);
        }

        renderPhaseSelect();

        window.setTimeout(function () {

            if (state.phase + 1 < PHASES.length) {
                loadPhase(state.phase + 1);
            } else {
                $("callout").textContent = "THE LOOP MASTER IS DEFEATED";
                HackoAudio.play("unlock");
                showReady(
                    "THE LOOP MASTER IS DEFEATED",
                    "Every volley stopped by a loop you wrote. " +
                    "Pick any phase on the right to fight it again.",
                    false
                );
            }
        }, 1800);
    }

    $("runBtn").addEventListener("click", fight);

    window.addEventListener("keydown", function (event) {
        if (event.ctrlKey && event.key === "Enter") {
            event.preventDefault();
            fight();
        }
    });

    $("hintBtn").addEventListener("click", function () {

        var next = hint.next();

        setVerdict(next.name.toUpperCase() + ": " + next.text, next.ok);
        $("hintBtn").textContent = hint.label();
        HackoAudio.play(next.ok ? "select" : "wrong");
    });

    loadPhase(0);


    /* =====================================================
       RESUME + AUTOSAVE
    ===================================================== */

    (function () {

        if (!window.HackoStore || !HackoStore.isLoggedIn()) {
            return;
        }

        HackoStore.registerTotalLevels(MISSION, PHASES.length);

        function goToSavedLevel() {

            var resume = HackoStore.getResumeLevel(MISSION);

            if (resume > 0 && resume < PHASES.length) {
                loadPhase(resume);
            }
        }

        if (document.readyState === "complete") {
            window.setTimeout(goToSavedLevel, 0);
        } else {
            window.addEventListener("load", function () {
                window.setTimeout(goToSavedLevel, 0);
            });
        }

        HackoStore.bindAutosave(function () {
            return {
                mission: MISSION,
                level: state.phase,
                lives: state.lives
            };
        });
    }());

}());
</script>
</body>
</html>
