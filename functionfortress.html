        const pillars = platformsOf("pillar");
        const totals = (state.calls || [])
            .filter(call => call.name === "combineCrystals")
            .map(call => Number(call.a || 0) + Number(call.b || 0));

        state.mech.values = [
            totals[0] || 0,
            totals.slice(1).reduce((sum, value) => sum + value, 0)
        ];

        blinkLasersOff();

        pillars.forEach((pillar, index) => {
            after(0.9 * index, () => {
                pillar.moving = true;
                HackoAudio.play("pickup");
            });
        });

        after(1.8, () => {
            openDoorNow();
            setMessage(`${state.mech.values[0]} + ${state.mech.values[1]} = 42 - the crystal staircase is ready!`);
        });

        setMessage("Each returned total grows a crystal pillar...");
    },

    core() {
        state.mech.core = state.clock;
        setMessage('activateCore(100, "fortress")...');

        after(1.1, () => {
            state.mech.token = state.clock;
            HackoAudio.play("correct");
            setMessage('activateCore returned "success" - shutdownDefense("success")...');
        });

        after(2.0, () => {
            state.lasers.forEach(laser => { laser.on = false; });
            state.mech.turretsDown = state.clock;
            state.bolts = [];
            HackoAudio.play("hit");
            openDoorNow();
            setMessage("Defences offline. The Core is yours - walk out!");
        });
    }
};

function solveStage() {
    const mechanic = MECHANICS[stage().mechanic];

    if (mechanic) {
        mechanic();
    } else {
        blinkLasersOff();
        openDoorNow();
    }
}

/* ---------- things each stage does every frame ---------- */

function stageTick(deltaTime) {
    const player = state.player;
    const source = stage();

    if (source.key && !state.mech.hasKey) {
        const key = { x: source.key.x, y: source.key.y, w: 24, h: 30 };

        if (overlap(player, key)) {
            state.mech.hasKey = true;
            HackoAudio.play("pickup");
            setMessage("Key collected - hasKey is now true. Go to the CODE button by the door!");
        }
    }

    /* jump pad */
    platformsOf("pad").forEach(pad => {
        const feet = player.y + player.h;
        const onPad =
            player.onGround &&
            feet >= pad.y - 3 &&
            feet <= pad.y + pad.h + 1 &&
            player.x + player.w > pad.x &&
            player.x < pad.x + pad.w;

        if (pad.charged && onPad) {
            player.vy = -900;
            player.onGround = false;
            state.mech.padFlash = state.clock;
            HackoAudio.play("jump");
        }
    });

    /* core turrets fire at Hacko until the defences go down */
    if (source.turrets && !state.mech.turretsDown) {
        state.mech.nextShot = state.mech.nextShot || 1.5;

        if (state.clock >= state.mech.nextShot) {
            const index = state.mech.shots = (state.mech.shots || 0) + 1;
            const turretX = source.turrets[index % source.turrets.length];
            const targetX = player.x + player.w / 2;
            const targetY = player.y + player.h / 2;
            const angle = Math.atan2(targetY - 40, targetX - turretX);

            state.bolts.push({
                x: turretX,
                y: 40,
                vx: Math.cos(angle) * 230,
                vy: Math.sin(angle) * 230
            });

            state.mech.nextShot = state.clock + (state.solved ? 0.9 : 1.25);
        }
    }

    state.bolts = state.bolts.filter(bolt => {
        bolt.x += bolt.vx * deltaTime;
        bolt.y += bolt.vy * deltaTime;

        /* the CODE button has a shield dome, so Hacko is safe
           while writing the program - reaching it is the test */
        if (Math.hypot(bolt.x - domeX(), bolt.y - CODE_BUTTON.top) < DOME_RADIUS) {
            state.mech.domeHit = state.clock;
            return false;
        }

        if (overlap(player, { x: bolt.x - 6, y: bolt.y - 6, w: 12, h: 12 })) {
            respawn("core turret");
            return false;
        }

        return bolt.y < 560 && bolt.x > -20 && bolt.x < 980;
    });
}

const DOME_RADIUS = 72;

function domeX() {
    return CODE_BUTTON.x + CODE_BUTTON.w / 2;
}

/* ---------- drawing ---------- */

function drawPlatform(platform, index, theme) {
    if (platform.kind === "pillar") {
        if (platform.h <= 0) {
            return;
        }

        const values = state.mech.values || [];
        const which = platformsOf("pillar").indexOf(platform);

        ctx.save();
        ctx.fillStyle = "#b67aff55";
        ctx.strokeStyle = "#e0c4ff";
        ctx.shadowColor = "#c08bff";
        ctx.shadowBlur = 20;
        ctx.beginPath();
        ctx.moveTo(platform.x, platform.y + platform.h);
        ctx.lineTo(platform.x + 6, platform.y);
        ctx.lineTo(platform.x + platform.w - 6, platform.y);
        ctx.lineTo(platform.x + platform.w, platform.y + platform.h);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 16px Orbitron";
        ctx.textAlign = "center";
        ctx.fillText(
            String(values[which] ?? ""),
            platform.x + platform.w / 2,
            platform.y + 26
        );
        ctx.restore();
        return;
    }

    if (platform.solid === false || platform.show < 1) {
        drawGhostPlatform(platform);

        if (platform.show <= 0) {
            return;
        }
    }

    ctx.save();
    ctx.globalAlpha = platform.show;

    if (platform.kind === "bridge") {
        const width = platform.w * platform.show;

        ctx.fillStyle = "#4da6ff";
        ctx.shadowColor = "#4da6ff";
        ctx.shadowBlur = 22;
        ctx.fillRect(platform.x, platform.y, width, 6);
        ctx.fillStyle = "#4da6ff44";
        ctx.fillRect(platform.x, platform.y + 6, width, platform.h - 6);
        ctx.restore();
        return;
    }

    if (platform.kind === "ghost") {
        ctx.fillStyle = "#ffb347";
        ctx.shadowColor = "#ffb347";
        ctx.shadowBlur = 18;
        ctx.fillRect(platform.x, platform.y, platform.w, platform.h);
        ctx.restore();
        return;
    }

    if (platform.kind === "drawbridge") {
        /* swings down from upright beside the shaft */
        const angle = (1 - platform.show) * (Math.PI / 2);

        ctx.translate(platform.x + platform.w, platform.y);
        ctx.rotate(angle);
        ctx.fillStyle = "#7a64d8";
        ctx.shadowColor = "#9c7bff";
        ctx.shadowBlur = 12;
        ctx.fillRect(-platform.w, 0, platform.w, platform.h);
        ctx.restore();
        return;
    }

    if (platform.kind === "pad") {
        const charged = platform.charged;
        const flash = state.mech.padFlash && state.clock - state.mech.padFlash < 0.25;

        ctx.fillStyle = charged ? "#ffd34d" : "#4a4030";
        ctx.shadowColor = "#ffd34d";
        ctx.shadowBlur = charged ? (flash ? 40 : 20) : 0;
        ctx.fillRect(platform.x, platform.y, platform.w, platform.h);
        ctx.fillStyle = "#1a1206";
        ctx.font = "bold 9px Orbitron";
        ctx.textAlign = "center";
        ctx.fillText(
            charged ? "▲ JUMP" : "NO POWER",
            platform.x + platform.w / 2,
            platform.y + 10
        );
        ctx.restore();
        return;
    }

    if (platform.kind === "car") {
        ctx.fillStyle = "#2b2f6b";
        ctx.fillRect(platform.x, platform.y, platform.w, platform.h);
        ctx.strokeStyle = state.mech.power ? "#9c7bff" : "#3c4070";
        ctx.shadowColor = "#9c7bff";
        ctx.shadowBlur = state.mech.power ? 16 : 0;
        ctx.lineWidth = 3;
        ctx.strokeRect(platform.x + 1, platform.y + 1, platform.w - 2, platform.h - 2);
        ctx.restore();
        return;
    }

    const kindColor =
        platform.kind === "mover"
            ? "#2a8a76"
            : platform.kind === "crate"
                ? "#5a4026"
                : index === 0
                    ? "#00000055"
                    : theme.plat;

    ctx.fillStyle = theme.plat;
    ctx.fillRect(platform.x, platform.y, platform.w, platform.h);
    ctx.fillStyle = kindColor;
    ctx.fillRect(platform.x, platform.y, platform.w, platform.h);

    ctx.fillStyle = theme.edge + "55";
    ctx.fillRect(platform.x, platform.y, platform.w, 5);

    ctx.strokeStyle = theme.edge + "88";
    ctx.strokeRect(platform.x + 2, platform.y + 2, platform.w - 4, platform.h - 4);

    if (platform.kind === "crate") {
        ctx.beginPath();
        ctx.moveTo(platform.x + 4, platform.y + 4);
        ctx.lineTo(platform.x + platform.w - 4, platform.y + platform.h - 4);
        ctx.moveTo(platform.x + platform.w - 4, platform.y + 4);
        ctx.lineTo(platform.x + 4, platform.y + platform.h - 4);
        ctx.stroke();
    }

    if (platform.kind === "mover") {
        ctx.fillStyle = "#3dffd0";
        ctx.font = "bold 10px Orbitron";
        ctx.textAlign = "center";
        ctx.fillText(
            platform.moving ? "◀ ▶" : "▶ 120",
            platform.x + platform.w / 2,
            platform.y + 14
        );
    }

    ctx.restore();
}

/* A platform that is not there yet: a faint dashed outline. */
function drawGhostPlatform(platform) {
    if (stage().mechanic === "torches") {
        return; /* hidden in the dark until a torch lights it */
    }

    ctx.save();
    ctx.setLineDash([6, 6]);
    ctx.strokeStyle = stage().theme.edge + "55";
    ctx.lineWidth = 2;

    if (platform.kind === "drawbridge") {
        ctx.strokeRect(platform.x + platform.w - platform.h, platform.y - platform.w, platform.h, platform.w);
    } else {
        ctx.strokeRect(platform.x, platform.y, platform.w, platform.h);
    }

    ctx.restore();
}

/* Behind the platforms: torches, meter, shaft, core, wiring. */
function drawStageBack() {
    const source = stage();
    const now = performance.now();

    if (source.mechanic === "torches") {
        platformsOf("ghost").forEach((stone, index) => {
            const lit = (state.mech.lit || 0) > index;
            const x = stone.x + stone.w / 2;

            ctx.save();
            ctx.fillStyle = "#3a2a1a";
            ctx.fillRect(x - 4, 300, 8, 34);

            if (lit) {
                const flicker = Math.sin(now / 90 + index) * 3;
                ctx.fillStyle = "#ffb347";
                ctx.shadowColor = "#ff8a1f";
                ctx.shadowBlur = 30;
                ctx.beginPath();
                ctx.ellipse(x, 290 + flicker / 2, 9, 15 + flicker, 0, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.fillStyle = "#2a2018";
                ctx.fillRect(x - 8, 292, 16, 10);
            }

            ctx.restore();
        });
    }

    if (source.mechanic === "meter") {
        const fill = (state.mech.meter || 0) / 100;

        ctx.save();
        ctx.fillStyle = "#1a1206";
        ctx.fillRect(600, 140, 44, 200);
        ctx.strokeStyle = "#ffd34d";
        ctx.lineWidth = 2;
        ctx.strokeRect(600, 140, 44, 200);
        ctx.fillStyle = "#ffd34d";
        ctx.shadowColor = "#ffd34d";
        ctx.shadowBlur = fill ? 16 : 0;
        ctx.fillRect(604, 336 - 192 * fill, 36, 192 * fill);
        ctx.shadowBlur = 0;
        ctx.strokeStyle = "#ffffff66";
        ctx.beginPath();
        ctx.moveTo(596, 240);
        ctx.lineTo(648, 240);
        ctx.stroke();
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 12px Orbitron";
        ctx.textAlign = "center";
        ctx.fillText(`${Math.round(state.mech.meter || 0)}`, 622, 130);
        ctx.font = "bold 9px Orbitron";
        ctx.fillText("POWER", 622, 356);
        ctx.restore();
    }

    if (source.mechanic === "elevator") {
        ctx.save();
        ctx.fillStyle = state.mech.power ? "#9c7bff18" : "#ffffff06";
        ctx.fillRect(600, 190, 80, 295);
        ctx.strokeStyle = state.mech.power ? "#9c7bff" : "#3c4070";
        ctx.shadowColor = "#9c7bff";
        ctx.shadowBlur = state.mech.power ? 14 : 0;
        ctx.lineWidth = 2;
        ctx.strokeRect(600, 190, 80, 295);
        ctx.restore();
    }

    if (source.mechanic === "chain") {
        /* the wire from the CODE button to the laser gates */
        const startX = CODE_BUTTON.x + CODE_BUTTON.w;
        const endX = 760;
        const y = 470;

        ctx.save();
        ctx.strokeStyle = "#ff496f55";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(startX, y);
        ctx.lineTo(endX, y);
        ctx.stroke();

        if (state.mech.spark !== undefined && state.mech.spark < 1) {
            const x = startX + (endX - startX) * state.mech.spark;
            ctx.fillStyle = "#fff6a0";
            ctx.shadowColor = "#ffd34d";
            ctx.shadowBlur = 24;
            ctx.beginPath();
            ctx.arc(x, y, 7, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.restore();
    }

    if (source.mechanic === "core") {
        const charged = state.mech.core !== undefined;
        const success = state.mech.token !== undefined;
        const pulse = 40 + Math.sin(now / (charged ? 90 : 300)) * 5;

        ctx.save();
        ctx.fillStyle = success ? "#91ff70" : charged ? "#ffd34d" : "#ff7a3d";
        ctx.shadowColor = ctx.fillStyle;
        ctx.shadowBlur = 40;
        ctx.globalAlpha = 0.85;
        ctx.beginPath();
        ctx.arc(640, 150, pulse, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.fillStyle = "#0c0204";
        ctx.font = "bold 12px Orbitron";
        ctx.textAlign = "center";
        ctx.fillText(success ? '"success"' : charged ? "100" : "CORE", 640, 155);

        if (success && !state.mech.turretsDown) {
            /* the token travels from the core to the shield */
            const t = Math.min(1, (state.clock - state.mech.token) / 0.9);
            ctx.strokeStyle = "#91ff70";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(640, 150);
            ctx.lineTo(640 + (816 - 640) * t, 150 + (400 - 150) * t);
            ctx.stroke();
        }

        ctx.restore();
    }
}

/* In front of everything: the key, turrets and bolts, darkness. */
function drawStageFront() {
    const source = stage();
    const now = performance.now();

    if (source.key && !state.mech.hasKey) {
        const bob = Math.sin(now / 250) * 4;

        ctx.save();
        ctx.translate(source.key.x + 12, source.key.y + 15 + bob);
        ctx.strokeStyle = "#ffd34d";
        ctx.fillStyle = "#ffd34d";
        ctx.shadowColor = "#ffd34d";
        ctx.shadowBlur = 18;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(0, -6, 7, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillRect(-2, 0, 4, 16);
        ctx.fillRect(2, 10, 6, 3);
        ctx.restore();
    }

    if (source.key) {
        /* the Smart Door's scanner shows the parameter */
        ctx.save();
        ctx.font = "bold 11px Orbitron";
        ctx.textAlign = "center";
        ctx.fillStyle = state.mech.hasKey ? "#91ff70" : "#ff496f";
        ctx.fillText(
            `hasKey = ${state.mech.hasKey ? "true" : "false"}`,
            DOOR.x + DOOR.w / 2,
            DOOR.y - 50
        );
        ctx.restore();
    }

    if (source.turrets) {
        source.turrets.forEach(x => {
            ctx.save();

            if (state.mech.turretsDown) {
                const age = state.clock - state.mech.turretsDown;

                if (age < 0.6) {
                    ctx.fillStyle = "#ffd34d";
                    ctx.globalAlpha = 1 - age / 0.6;
                    ctx.beginPath();
                    ctx.arc(x, 30, 10 + age * 60, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.globalAlpha = 1;
                ctx.fillStyle = "#3a2a2a";
                ctx.fillRect(x - 16, 14, 32, 10);
            } else {
                ctx.fillStyle = "#5a1424";
                ctx.fillRect(x - 18, 0, 36, 22);
                ctx.fillStyle = "#ff7a3d";
                ctx.shadowColor = "#ff7a3d";
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.arc(x, 28, 9, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        });
    }

    if (source.turrets && !state.mech.turretsDown) {
        const flash =
            state.mech.domeHit !== undefined &&
            state.clock - state.mech.domeHit < 0.2;

        ctx.save();
        ctx.strokeStyle = flash ? "#ffffff" : "#45f3ff88";
        ctx.fillStyle = flash ? "#45f3ff33" : "#45f3ff12";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(domeX(), CODE_BUTTON.top, DOME_RADIUS, Math.PI, 0);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
    }

    state.bolts.forEach(bolt => {
        ctx.save();
        ctx.fillStyle = "#ffb347";
        ctx.shadowColor = "#ff7a3d";
        ctx.shadowBlur = 16;
        ctx.beginPath();
        ctx.arc(bolt.x, bolt.y, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    });

    if (source.mechanic === "sleep" && state.mech.awake === undefined) {
        ctx.save();
        ctx.fillStyle = "#c9d6ff";
        ctx.font = "bold 16px Orbitron";
        ctx.textAlign = "left";

        for (let z = 0; z < 3; z++) {
            const t = ((now / 1000 + z * 0.6) % 1.8) / 1.8;
            ctx.globalAlpha = 1 - t;
            ctx.fillText("z", DOOR.x + 34 + t * 30 + z * 4, DOOR.y - 20 - t * 50);
        }

        ctx.restore();
    }

    if (source.mechanic === "torches") {
        /* the hall is dark until the torches are lit */
        const lit = state.mech.lit || 0;
        const darkness = 0.9 * (1 - lit / 3);

        if (darkness > 0) {
            const player = state.player;
            const cx = player.x + player.w / 2;
            const cy = player.y + player.h / 2;
            const light = ctx.createRadialGradient(cx, cy, 50, cx, cy, 190);

            light.addColorStop(0, "rgba(0,0,0,0)");
            light.addColorStop(1, `rgba(0,0,0,${darkness})`);

            ctx.save();
            ctx.fillStyle = light;
            ctx.fillRect(0, 0, 960, 540);
            ctx.restore();
        }
    }
}

/* three lives per mission - see loseLifeAndMaybeDemote() */
let missionLives = 3;
let lastFootstep = 0;
let state;
let keys = {};

let progress =
    JSON.parse(
        localStorage.getItem(
            "hackoFunctionProgress"
        ) ||
        '{"unlocked":1,"done":[]}'
    );

function clean(value) {
    return String(
        value ?? ""
    )
        .trim()
        .replace(
            /^['"]|['"]$/g,
            ""
        )
        .toLowerCase();
}

function hasFn(
    gameState,
    name,
    params,
    action = null,
    returnValue = null,
    nested = null
) {
    return gameState.functions.some(
        fn => {
            return (
                fn.name === name &&
                fn.params === params &&
                (
                    action === null ||
                    fn.action === action
                ) &&
                (
                    returnValue === null ||
                    fn.ret === returnValue
                ) &&
                (
                    nested === null ||
                    fn.nested === nested
                )
            );
        }
    );
}

function calls(
    gameState,
    name
) {
    return gameState.calls.filter(
        call => {
            return call.name === name;
        }
    );
}

function loadLevel(index) {
    level = index;

    /* Client rule: three lives per level, not per mission. */
    missionLives = 3;

    const built =
        buildStage(index);

    const spawn =
        STAGES[index].spawn;

    state = {
        player: {
            x: spawn.x,
            y: spawn.y,
            w: 38,
            h: 50,
            vx: 0,
            vy: 0,
            carry: 0,
            onGround: false
        },
        platforms: built.platforms,
        functions: [],
        calls: [],
        consoleActive: false,
        doorOpen: 0,
        doorReady: false,
        solved: false,
        won: false,
        stones: built.stones,
        enemies: built.enemies,
        lasers: built.lasers,
        mechanism: 0,
        /* stage mechanics */
        clock: 0,
        timeline: [],
        tweens: [],
        bolts: [],
        mech: {},
        keyNagged: false
    };

    keys = {};

    populateBuilder();

    document.getElementById(
        "missionTitle"
    ).textContent =
        `Mission ${index + 1}: ` +
        missions[index].title;

    document.getElementById(
        "missionGoal"
    ).textContent =
        missions[index].goal;

    document.getElementById(
        "missionRule"
    ).textContent =
        missions[index].rule;

    document.getElementById(
        "dialogue"
    ).textContent =
        missions[index].dialogue;

    document.getElementById(
        "levelStat"
    ).textContent =
        `${index + 1}/10`;

    setFeedback(
        "Locked - stand on the CODE button by the door."
    );

    setMessage(
        STAGES[index].intro
    );

    renderLevels();
    updateUI();
}

function populateBuilder() {
    const mission =
        missions[level];

    fill(
        "fnName",
        mission.names
    );

    fill(
        "fnParams",
        mission.params
    );

    fill(
        "fnAction",
        mission.actions
    );

    fill(
        "fnReturn",
        mission.returns
    );

    fill(
        "fnNested",
        mission.nested
    );

    fill(
        "callName",
        mission.names
    );

    previewCode();
    renderProgram();
}

function fill(id, values) {
    document.getElementById(
        id
    ).innerHTML =
        values.map(value => {
            return (
                `<option value="${value}">` +
                `${value}</option>`
            );
        }).join("");
}

function value(id) {
    return document.getElementById(
        id
    ).value;
}

function previewCode() {
    const name =
        value("fnName");

    const params =
        value("fnParams") === "none"
            ? ""
            : value("fnParams");

    const action =
        value("fnAction");

    const returnValue =
        value("fnReturn");

    const nested =
        value("fnNested");

    let body =
        `  ${action};`;

    if (nested !== "none") {
        body +=
            `\n  ${nested};`;
    }

    if (
        returnValue !== "none"
    ) {
        body +=
            `\n  return ${javaReturnValue(returnValue)};`;
    }

    document.getElementById(
        "codePreview"
    ).textContent =
        `${javaReturnType(returnValue)} ${name}` +
        `(${javaParams(params)}) {\n` +
        `${body}\n}`;
}

function saveFunction() {
    HackoAudio.play("select");
    if (!state.consoleActive) {
        setFeedback(
            "Stand on the CODE button first.",
            false
        );

        return;
    }

    const fn = {
        name:
            value("fnName"),
        params:
            value("fnParams"),
        action:
            value("fnAction"),
        ret:
            value("fnReturn"),
        nested:
            value("fnNested")
    };

    const existingIndex =
        state.functions.findIndex(
            savedFunction => {
                return (
                    savedFunction.name ===
                    fn.name
                );
            }
        );

    if (existingIndex >= 0) {
        state.functions[
            existingIndex
        ] = fn;
    } else {
        state.functions.push(fn);
    }

    setFeedback(
        `${fn.name}() saved to the gauntlet.`,
        true
    );

    renderProgram();
    updateUI();
}

function clearFunctions() {
    state.functions = [];
    state.calls = [];
    state.solved = false;

    renderProgram();
    updateUI();

    setFeedback(
        "Program cleared."
    );
}

function addCall() {
    HackoAudio.play("correct");
    if (!state.consoleActive) {
        setFeedback(
            "Stand on the CODE button first.",
            false
        );

        return;
    }

    state.calls.push({
        name:
            value("callName"),
        a:
            value("arg1"),
        b:
            value("arg2")
    });

    document.getElementById(
        "arg1"
    ).value = "";

    document.getElementById(
        "arg2"
    ).value = "";

    renderProgram();

    setFeedback(
        "Function call added."
    );
}

function removeLastCall() {
    state.calls.pop();
    renderProgram();
}

function renderProgram() {
    const savedFunctions =
        document.getElementById(
            "savedFunctions"
        );

    const callList =
        document.getElementById(
            "callList"
        );

    savedFunctions.innerHTML =
        state.functions.length
            ? state.functions.map(fn => {
                return (
                    `<div class="token">` +
                    `<b>ƒ</b> ` +
                    `${fn.name}(` +
                    `${fn.params === "none" ? "" : fn.params}` +
                    `) → ${fn.action}` +
                    `${
                        fn.ret !== "none"
                            ? ` → return ${fn.ret}`
                            : ""
                    }` +
                    `${
                        fn.nested !== "none"
                            ? ` → ${fn.nested}`
                            : ""
                    }` +
                    `</div>`
                );
            }).join("")
            : (
                `<div class="token">` +
                `No saved functions` +
                `</div>`
            );

    callList.innerHTML =
        state.calls.length
            ? state.calls.map(
                (call, index) => {
                    return (
                        `<div class="token">` +
                        `<b>${index + 1}.</b> ` +
                        `${call.name}(` +
                        `${
                            [
                                call.a,
                                call.b
                            ]
                            .filter(Boolean)
                            .join(", ")
                        }` +
                        `)</div>`
                    );
                }
            ).join("")
            : (
                `<div class="token">` +
                `No function calls` +
                `</div>`
            );
}

function executeProgram() {
    if (!state.consoleActive) {
        setFeedback(
            "Stand on the CODE button first.",
            false
        );

        return;
    }

    if (
        !missions[level].validate(
            state
        )
    ) {
        setFeedback(
            "Program failed. Compare your blocks and call order with the mission rule.",
            false
        );

        HackoAudio.play("wrong");

        state.mechanism = 0;

        return;
    }

    state.solved = true;
    state.mechanism = 1;

    HackoAudio.play("unlock");

    solveStage();

    setFeedback(
        "PROGRAM SUCCESS! Fortress mechanism activated.",
        true
    );

    if (state.doorReady && stage().mechanic === "sleep") {
        setMessage(
            "Mechanism online! The door is opening - walk through it."
        );
    }
}

function update(deltaTime) {
    if (state.won) {
        return;
    }

    const player =
        state.player;

    runTimeline(deltaTime);
    runTweens();
    movePlatforms(deltaTime);

    const speed = 260;

    const movingLeft =
        keys.a ||
        keys.A ||
        keys.ArrowLeft;

    const movingRight =
        keys.d ||
        keys.D ||
        keys.ArrowRight;

    player.vx =
        (
            movingRight
                ? speed
                : 0
        ) -
        (
            movingLeft
                ? speed
                : 0
        );

    player.vy +=
        1250 * deltaTime;

    player.x +=
        player.vx * deltaTime;

    /* still moving with the platform Hacko jumped off */
    if (!player.onGround) {
        player.x +=
            player.carry * deltaTime;
    }

    collideX(player);

    player.y +=
        player.vy * deltaTime;

    const wasOnGround =
        player.onGround;

    const fallSpeed =
        player.vy;

    player.onGround = false;

    collideY(player);

    /* landing thud - only after a real fall, not every frame */
    if (
        player.onGround &&
        !wasOnGround &&
        fallSpeed > 200
    ) {
        HackoAudio.play("land");
    }

    stageTick(deltaTime);

    /* footsteps while running on the ground, same as the Escape Room */
    if (
        player.onGround &&
        Math.abs(player.vx) > 20 &&
        performance.now() - lastFootstep > 240
    ) {
        lastFootstep = performance.now();
        HackoAudio.play("tick");
    }

    player.x =
        Math.max(
            0,
            Math.min(
                922,
                player.x
            )
        );

    if (player.y > 560) {
        respawn(
            "falling"
        );
    }

    const jumping =
        keys[" "] ||
        keys.ArrowUp ||
        keys.w ||
        keys.W;

    if (
        jumping &&
        player.onGround
    ) {
        player.vy = -520;
        player.onGround = false;

        HackoAudio.play("jump");

        keys[" "] = false;
        keys.ArrowUp = false;
        keys.w = false;
        keys.W = false;
    }

    /* Client request: the CODE box is now a floor button by the
       door, and the question only unlocks while Hacko is
       standing on it. Touching the old box once unlocked it for
       good. */
    const centerX =
        player.x + player.w / 2;

    const standing =
        player.onGround &&
        centerX >= CODE_BUTTON.x &&
        centerX <= CODE_BUTTON.x + CODE_BUTTON.w &&
        Math.abs(
            player.y + player.h - CODE_BUTTON.top
        ) < 3;

    /* Smart Door: the button only answers once Hacko holds
       the key, so hasKey is true in the world, not just in code */
    const needsKey =
        !!stage().key &&
        !state.mech.hasKey;

    if (standing && needsKey && !state.keyNagged) {
        state.keyNagged = true;
        HackoAudio.play("wrong");
        setMessage(
            "The Smart Door scanner reads hasKey = false. Climb up and grab the key first!"
        );
    }

    if (!standing) {
        state.keyNagged = false;
    }

    const onButton =
        standing &&
        !needsKey;

    if (
        !state.solved &&
        onButton !== state.consoleActive
    ) {
        state.consoleActive = onButton;

        if (onButton) {
            HackoAudio.play("open");

            setMessage(
                "CODE button pressed! Stay on it while you build, save, call, and run."
            );

            setFeedback(
                "Function Gauntlet online.",
                true
            );
        } else if (performance.now() > hurtTime) {
            /* after a hit, keep the "Hit by..." message */
            HackoAudio.play("bump");

            setMessage(
                "You stepped off the CODE button. Stand on it to unlock the question again."
            );

            setFeedback(
                "Locked - stand on the CODE button by the door.",
                false
            );
        }
    }

    state.stones.forEach(
        stone => {
            if (
                !stone.taken &&
                overlap(
                    player,
                    {
                        x: stone.x,
                        y: stone.y,
                        w: 22,
                        h: 22
                    }
                )
            ) {
                stone.taken = true;

                HackoAudio.play("pickup");

                setMessage(
                    "Function Stone collected."
                );
            }
        }
    );

    state.enemies.forEach(
        enemy => {
            enemy.x +=
                enemy.dir *
                enemy.speed;

            if (
                enemy.x < enemy.min ||
                enemy.x > enemy.max
            ) {
                enemy.dir *= -1;
            }

            if (
                overlap(
                    player,
                    enemy
                )
            ) {
                respawn(
                    "fortress sentry"
                );
            }
        }
    );

    state.lasers.forEach(
        laser => {
            const active =
                laser.steady ||
                Math.floor(
                    performance.now() /
                    650 +
                    laser.phase
                ) % 2 === 0;

            if (
                laser.on &&
                active &&
                overlap(
                    player,
                    {
                        x: laser.x,
                        y: laser.y,
                        w: 8,
                        h: laser.h
                    }
                )
            ) {
                respawn(
                    "laser grid"
                );
            }
        }
    );

    /* the door is solid until it has fully opened - some
       stages open it at the end of a sequence, not at once */
    if (
        state.doorOpen < 1 &&
        player.x + player.w > DOOR.x
    ) {
        player.x = DOOR.x - player.w;
    }

    if (state.solved && state.doorReady) {
        state.doorOpen =
            Math.min(
                1,
                state.doorOpen + deltaTime * 1.6
            );
    }

    /* walking through the open doorway ends the level - the
       doorway has to be at Hacko's height (some doors are high) */
    if (
        state.doorOpen >= 1 &&
        player.x + player.w / 2 > DOOR.x + DOOR.w / 2 &&
        player.y + player.h > DOOR.y &&
        player.y < DOOR.y + DOOR.h
    ) {
        completeLevel();
    }

    updateUI();
}

function collideX(player) {
    state.platforms.forEach(
        platform => {
            /* the jump pad is a floor plate Hacko walks onto,
               not a step that blocks the way */
            if (
                platform.solid &&
                platform.kind !== "pad" &&
                overlap(
                    player,
                    platform
                )
            ) {
                if (player.vx > 0) {
                    player.x =
                        platform.x -
                        player.w;
                } else if (
                    player.vx < 0
                ) {
                    player.x =
                        platform.x +
                        platform.w;
                }
            }
        }
    );
}

function collideY(player) {
    state.platforms.forEach(
        platform => {
            if (
                platform.solid &&
                overlap(
                    player,
                    platform
                )
            ) {
                if (player.vy > 0) {
                    player.y =
                        platform.y -
                        player.h;

                    player.vy = 0;
                    player.onGround = true;
                } else if (
                    player.vy < 0
                ) {
                    player.y =
                        platform.y +
                        platform.h;

                    player.vy = 0;
                }
            }
        }
    );
}

function overlap(a, b) {
    return (
        a.x < b.x + b.w &&
        a.x + a.w > b.x &&
        a.y < b.y + b.h &&
        a.y + a.h > b.y
    );
}

let hurtTime = 0;

/* Client rule: one hit costs one life straight away - there is
   no energy bar to wear down first. With lives left Hacko goes
   back to the checkpoint. */
function respawn(source) {
    if (
        performance.now() <
        hurtTime
    ) {
        return;
    }

    hurtTime =
        performance.now() + 1200;

    HackoAudio.play("hit");

    state.player.x = stage().spawn.x;
    state.player.y = stage().spawn.y;
    state.player.vx = 0;
    state.player.vy = 0;
    state.player.carry = 0;
    state.bolts = [];

    const lastLife = missionLives <= 1;

    if (loseLifeAndMaybeDemote()) {
        setMessage(
            "Out of lives. Back to level " + (level + 1) + "."
        );
        return;
    }

    if (lastLife) {
        setTimeout(() => {
            alert(
                "Hacko is out of lives. The level will restart."
            );

            restartLevel();
        }, 50);
        return;
    }

    setMessage(
        `Hit by ${source}! ${missionLives} ` +
        (missionLives === 1 ? "life" : "lives") +
        " left. Returned to checkpoint."
    );
}

/* No lives before this either. */
function loseLifeAndMaybeDemote() {

    missionLives -= 1;

    updateUI();

    if (missionLives > 0) {
        HackoAudio.play("wrong");
        return false;
    }

    missionLives = 3;

    if (window.HackoStore) {

        const back = HackoStore.loseAllLives(6, level);

        HackoAudio.play("gameover");
        loadLevel(back);
        return true;
    }

    return false;
}

function completeLevel() {
    /* tell the mission map this level is cleared */
    if (window.HackoStore) {
        HackoStore.completeLevel(6, level, 100);
    }

    HackoAudio.play("win");
    if (state.won) {
        return;
    }

    state.won = true;

    progress.unlocked =
        Math.max(
            progress.unlocked,
            Math.min(
                10,
                level + 2
            )
        );

    if (
        !progress.done.includes(
            level
        )
    ) {
        progress.done.push(
            level
        );
    }

    localStorage.setItem(
        "hackoFunctionProgress",
        JSON.stringify(progress)
    );

    document.getElementById(
        "modalTitle"
    ).textContent =
        level === 9
            ? "FORTRESS MASTER!"
            : "MISSION COMPLETE";

    document.getElementById(
        "modalText"
    ).textContent =
        level === 9
            ? (
                "Hacko shut down the fortress defenses " +
                "and mastered functions!"
            )
            : (
                "Hacko activated the mechanism " +
                "and escaped the room."
            );

    document.getElementById(
        "solutionCode"
    ).textContent =
        missions[level].solution;

    const nextButton =
        document.getElementById(
            "nextBtn"
        );

    nextButton.textContent =
        level === 9
            ? "PLAY AGAIN"
            : "NEXT MISSION";

    nextButton.onclick = () => {
        closeOverlay();

        loadLevel(
            level === 9
                ? 0
                : level + 1
        );
    };

    document.getElementById(
        "overlay"
    ).classList.add(
        "show"
    );

    renderLevels();
}

function updateUI() {
    document.getElementById(
        "livesStat"
    ).textContent =
        missionLives;

    document.getElementById(
        "stoneStat"
    ).textContent =
        `${
            state.stones.filter(
                stone => stone.taken
            ).length
        }/${state.stones.length}`;

    document.getElementById(
        "functionStat"
    ).textContent =
        state.functions.length;

    [
        "saveFnBtn",
        "addCallBtn"
    ].forEach(id => {
        document.getElementById(
            id
        ).disabled =
            !state.consoleActive;
    });

    document.getElementById(
        "side"
    ).classList.toggle(
        "locked",
        !state.consoleActive && !state.solved
    );
}

function renderLevels() {
    document.getElementById(
        "levels"
    ).innerHTML =
        missions.map(
            (mission, index) => {
                const active =
                    index === level
                        ? " active"
                        : "";

                const completed =
                    progress.done.includes(
                        index
                    )
                        ? " done"
                        : "";

                const disabled =
                    index >= progress.unlocked
                        ? "disabled"
                        : "";

                return (
                    `<button ` +
                    `class="level${active}${completed}" ` +
                    `${disabled} ` +
                    `onclick="loadLevel(${index})" ` +
                    `title="${mission.title}">` +
                    `${index + 1}` +
                    `</button>`
                );
            }
        ).join("");
}

function setFeedback(
    text,
    good = null
) {
    const feedback =
        document.getElementById(
            "feedback"
        );

    feedback.textContent =
        text;

    feedback.className =
        "feedback" +
        (
            good === true
                ? " good"
                : good === false
                    ? " bad"
                    : ""
        );
}

function setMessage(text) {
    document.getElementById(
        "stageMessage"
    ).textContent =
        text;
}

function restartLevel() {
    HackoAudio.play("wrong");
    loadLevel(level);
}

function closeOverlay() {
    document.getElementById(
        "overlay"
    ).classList.remove(
        "show"
    );
}

function draw() {
    ctx.clearRect(
        0,
        0,
        960,
        540
    );

    const background =
        ctx.createLinearGradient(
            0,
            0,
            0,
            540
        );

    const theme =
        stage().theme;

    background.addColorStop(
        0,
        theme.sky[0]
    );

    background.addColorStop(
        0.55,
        theme.sky[1]
    );

    background.addColorStop(
        1,
        theme.sky[2]
    );

    ctx.fillStyle =
        background;

    ctx.fillRect(
        0,
        0,
        960,
        540
    );

    ctx.fillStyle =
        "#ffffff08";

    for (
        let x = 0;
        x < 960;
        x += 60
    ) {
        for (
            let y = 0;
            y < 540;
            y += 60
        ) {
            ctx.fillRect(
                x + 5,
                y + 5,
                48,
                3
            );
        }
    }

    drawStageBack();

    state.platforms.forEach(
        (platform, index) => {
            drawPlatform(
                platform,
                index,
                theme
            );
        }
    );

    drawConsole();
    drawStones();
    drawLasers();
    drawEnemies();
    drawMechanism();
    drawHacko();
    drawStageFront();
}

/* A floor button: it sinks and turns green while pressed. */
function drawConsole() {
    const pressed =
        state.consoleActive;

    const glow =
        pressed || state.solved
            ? "#91ff70"
            : "#45f3ff";

    const x = CODE_BUTTON.x;
    const w = CODE_BUTTON.w;
    const top = CODE_BUTTON.top;
    const height = pressed ? 4 : 10;

    ctx.save();

    /* base plate */
    ctx.fillStyle = "#0b2236";
    ctx.fillRect(x - 6, top - 3, w + 12, 3);

    /* the button itself */
    ctx.shadowBlur = pressed ? 22 : 14;
    ctx.shadowColor = glow;
    ctx.fillStyle = pressed ? "#1f5a2e" : "#123f5c";

    ctx.fillRect(x, top - 3 - height, w, height);

    ctx.strokeStyle = glow;
    ctx.lineWidth = 2;
    ctx.strokeRect(x, top - 3 - height, w, height);

    /* label floating above it */
    ctx.shadowBlur = 8;
    ctx.fillStyle = glow;
    ctx.font = "bold 11px Orbitron";
    ctx.textAlign = "center";

    ctx.fillText(
        "CODE",
        x + w / 2,
        top - 20
    );

    if (!pressed && !state.solved) {
        const bob =
            Math.sin(performance.now() / 220) * 3;

        ctx.fillText(
            "▼",
            x + w / 2,
            top - 34 + bob
        );
    }

    ctx.restore();
}

function drawStones() {
    state.stones.forEach(
        stone => {
            if (stone.taken) {
                return;
            }

            ctx.save();

            ctx.translate(
                stone.x + 11,
                stone.y + 11
            );

            ctx.rotate(
                performance.now() /
                700
            );

            ctx.shadowBlur = 16;
            ctx.shadowColor = "#ffd34e";
            ctx.fillStyle = "#ffd34e";

            ctx.fillRect(
                -9,
                -9,
                18,
                18
            );

            ctx.restore();
        }
    );
}

function drawLasers() {
    state.lasers.forEach(
        laser => {
            if (!laser.on) {
                return;
            }

            const active =
                Math.floor(
                    performance.now() /
                    650 +
                    laser.phase
                ) % 2 === 0;

            const lit =
                active ||
                laser.steady;

            ctx.fillStyle =
                lit
                    ? (laser.shield ? "#ff7a3d" : "#ff496f")
                    : "#ff496f33";

            ctx.shadowBlur =
                lit
                    ? 18
                    : 0;

            ctx.shadowColor =
                "#ff496f";

            ctx.fillRect(
                laser.x,
                laser.y,
                laser.shield ? 10 : 8,
                laser.h
            );

            ctx.shadowBlur = 0;
        }
    );
}

function drawEnemies() {
    state.enemies.forEach(
        enemy => {
            ctx.save();

            ctx.translate(
                enemy.x + 17,
                enemy.y + 15
            );

            ctx.fillStyle = "#ff496f";
            ctx.shadowBlur = 14;
            ctx.shadowColor = "#ff496f";

            ctx.beginPath();

            ctx.arc(
                0,
                0,
                15,
                0,
                Math.PI * 2
            );

            ctx.fill();

            ctx.fillStyle = "#07111e";

            ctx.fillRect(
                -8,
                -4,
                5,
                5
            );

            ctx.fillRect(
                3,
                -4,
                5,
                5
            );

            ctx.restore();
        }
    );
}

function drawHacko() {
    const player =
        state.player;

    ctx.save();

    if (
        performance.now() <
        hurtTime &&
        Math.floor(
            performance.now() / 80
        ) % 2 === 0
    ) {
        ctx.globalAlpha = 0.35;
    }

    ctx.shadowBlur = 18;
    ctx.shadowColor = "#45f3ff";

    if (hackoReady) {
        ctx.drawImage(
            hacko,
            player.x - 7,
            player.y - 7,
            player.w + 14,
            player.h + 14
        );
    } else {
        ctx.fillStyle = "#45f3ff";

        ctx.fillRect(
            player.x,
            player.y,
            player.w,
            player.h
        );

        ctx.fillStyle = "#07111e";
        ctx.font = "bold 16px Orbitron";
        ctx.textAlign = "center";

        ctx.fillText(
            "H",
            player.x +
            player.w / 2,
            player.y + 31
        );
    }

    ctx.restore();
}

function drawMechanism() {
    ctx.save();

    const solved =
        state.solved;

    const pulse =
        14 +
        Math.sin(
            performance.now() /
            180
        ) * 3;

    ctx.fillStyle =
        solved
            ? "#91ff70"
            : "#ff496f";

    ctx.shadowBlur = 22;
    ctx.shadowColor =
        ctx.fillStyle;

    ctx.strokeStyle =
        ctx.fillStyle;

    /* Client request: a proper door at the end. It used to be
       a red bar that turned into an outline beside a separate
       portal, so it never looked like it opened. Now the two
       panels slide apart and the doorway is the exit. */
    const open = state.doorOpen;
    const half = DOOR.w / 2;
    const slide = half * open;

    /* doorway light, visible as the panels part */
    if (open > 0) {
        ctx.fillStyle = "#91ff7055";
        ctx.fillRect(DOOR.x, DOOR.y, DOOR.w, DOOR.h);
    }

    /* frame */
    ctx.lineWidth = 5;
    ctx.strokeRect(
        DOOR.x - 4,
        DOOR.y - 4,
        DOOR.w + 8,
        DOOR.h + 4
    );

    /* panels */
    ctx.shadowBlur = 10;
    ctx.fillStyle = solved ? "#1f5a2e" : "#5a1a2a";

    ctx.fillRect(DOOR.x, DOOR.y, half - slide, DOOR.h);
    ctx.fillRect(DOOR.x + half + slide, DOOR.y, half - slide, DOOR.h);

    /* lock light */
    ctx.fillStyle = solved ? "#91ff70" : "#ff496f";
    ctx.beginPath();
    ctx.arc(
        DOOR.x + DOOR.w / 2,
        DOOR.y - 14,
        solved ? pulse / 2 : 6,
        0,
        Math.PI * 2
    );
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 10px Orbitron";
    ctx.textAlign = "center";

    ctx.fillText(
        stage().label,
        DOOR.x + DOOR.w / 2,
        DOOR.y - 30
    );

    ctx.restore();
}

let last =
    performance.now();

function loop(now) {
    const deltaTime =
        Math.min(
            0.025,
            (
                now -
                last
            ) / 1000
        );

    last = now;

    update(deltaTime);
    draw();

    requestAnimationFrame(
        loop
    );
}

window.addEventListener(
    "keydown",
    event => {
        /* typing an argument like "red" or "5" used to walk
           Hacko around - and off the CODE button */
        if (
            event.target.closest &&
            event.target.closest("input, select, textarea")
        ) {
            return;
        }

        keys[event.key] = true;

        if (
            [
                " ",
                "ArrowUp",
                "ArrowLeft",
                "ArrowRight"
            ].includes(
                event.key
            )
        ) {
            event.preventDefault();
        }
    }
);

window.addEventListener(
    "keyup",
    event => {
        keys[event.key] = false;
    }
);

loadLevel(
    Math.min(
        progress.unlocked - 1,
        9
    )
);

requestAnimationFrame(
    loop
);

/* =====================================================
   RESUME + AUTOSAVE

   Progress used to be written only when a level was
   finished, and no page in the project listened for
   pagehide or visibilitychange. Leaving mid-level threw
   that level's work away - which is what the client meant
   by "pag na back mawawala".

   Every cleared level is now recorded as it happens, and
   coming back drops the player at the start of the level
   they had reached.
===================================================== */

(function () {

    if (!window.HackoStore || !HackoStore.isLoggedIn()) {
        return;
    }

    HackoStore.registerTotalLevels(6, 10);

    /* The jump has to happen AFTER the game has booted.
       theescaperoom builds itself in window.onload, so doing
       this at parse time meant its own loadLevel(0) ran
       afterwards and silently sent the player back to level 1.
       A load listener registered here fires after any onload
       the page assigned earlier. */
    function goToSavedLevel() {

        var resume = HackoStore.getResumeLevel(6);

        if (resume > 0 && resume < 10) {
            try {
                loadLevel(resume);
            } catch (e) {
                /* a game that cannot jump just starts at the top */
            }
        }
    }

    if (document.readyState === "complete") {
        setTimeout(goToSavedLevel, 0);
    } else {
        window.addEventListener("load", function () {
            setTimeout(goToSavedLevel, 0);
        });
    }

    HackoStore.bindAutosave(function () {
        try {
            return { mission: 6, level: level };
        } catch (e) {
            return null;
        }
    });

}());

/* =====================================================
   SOUND LAYER

   Sound used to fire only on a few discrete events, so a
   game could sit in silence for long stretches. Every page
   now carries a quiet background track and a visible
   SOUND ON / SOUND OFF button, so a player can always tell
   whether audio is working.

   Browsers will not start audio until the player has
   interacted, so the track is requested here and actually
   begins on the first key press or click.
===================================================== */

(function () {

    if (!window.HackoAudio) {
        return;
    }

    function begin() {
        HackoAudio.music.play("fortress");
        HackoAudio.mountToggle(document.body);
        if (window.HackoStore) {
            HackoStore.mountMapLink();
        }
    }

    if (document.readyState === "complete") {
        begin();
    } else {
        window.addEventListener("load", begin);
    }

}());
</script>
</body>
</html>
