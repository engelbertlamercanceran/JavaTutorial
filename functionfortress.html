<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hacko: Function Fortress</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap');

:root {
    --cyan: #45f3ff;
    --lime: #91ff70;
    --amber: #ffd34e;
    --red: #ff496f;
    --violet: #b67aff;
    --ink: #06101e;
    --panel: #102944;
    --line: #397e9e;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
    color: #effbff;
    font-family: Rajdhani, sans-serif;
    background:
        radial-gradient(circle at 12% 10%, #1a5473, transparent 31%),
        radial-gradient(circle at 88% 7%, #503371, transparent 27%),
        #06101e;
}

body {
    display: grid;
    grid-template-rows: auto 1fr auto;
    min-height: 100vh;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 11px 18px;
    border-bottom: 2px solid var(--cyan);
    background: #071426ee;
    box-shadow: 0 0 28px #45f3ff35;
}

.brand {
    font: 900 clamp(1.15rem, 3vw, 2rem) Orbitron;
    color: var(--cyan);
    text-shadow: 0 0 15px #45f3ff99;
}

.brand small {
    display: block;
    color: white;
    font-size: 0.5rem;
    letter-spacing: 0.2em;
}

.stats {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.chip {
    padding: 7px 11px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: #102c48;
    font: 700 0.7rem Orbitron;
}

.chip b {
    color: var(--lime);
}

button {
    border: 0;
    border-radius: 9px;
    padding: 9px 12px;
    cursor: pointer;
    color: #05111a;
    background: linear-gradient(135deg, var(--cyan), #65ffc6);
    font: 700 0.73rem Orbitron;
    box-shadow: 0 4px 12px #0007;
}

button:hover:not(:disabled) {
    filter: brightness(1.13);
    transform: translateY(-1px);
}

button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
}

.secondary {
    color: white;
    background: #1d4767;
    border: 1px solid #4787a7;
}

.danger {
    color: white;
    background: linear-gradient(135deg, #ff496f, #ff873e);
}

main {
    display: grid;
    grid-template-columns: minmax(560px, 1fr) 390px;
    align-items: start;
    gap: 13px;
    padding: 13px;
    min-height: 0;
}

/* The stage used to stretch to the height of the coding panel
   with the level centred inside it, so the floor - where most of
   the action is - sat below the fold. It now stays pinned at the
   top and is sized to fit the screen. */
.stage {
    position: sticky;
    top: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border: 3px solid #3bd9e8;
    border-radius: 20px;
    background: #06111f;
    box-shadow:
        0 0 38px #45f3ff35,
        inset 0 0 45px #000b;
}

.stage canvas {
    width: min(100%, 960px, calc((100vh - 120px) * 16 / 9));
    height: auto;
    display: block;
}

.stage-message {
    position: absolute;
    left: 18px;
    bottom: 16px;
    max-width: 70%;
    padding: 9px 13px;
    border: 1px solid #4a89a7;
    border-radius: 9px;
    background: #06121ee8;
    box-shadow: 0 5px 18px #0009;
    font-weight: 700;
}

.side {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 0;
}

.panel {
    padding: 13px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: linear-gradient(155deg, #173954, #0a1d33 75%);
    box-shadow:
        inset 0 0 22px #45f3ff0b,
        0 6px 17px #0006;
}

/* the question stays locked until Hacko stands on the CODE button */
.side.locked .gated > *:not(h3):not(.feedback) {
    opacity: 0.3;
    filter: grayscale(0.8);
    pointer-events: none;
}

.side.locked .gated h3::after {
    content: "  🔒 STAND ON THE CODE BUTTON";
    color: var(--amber);
    font-size: 0.68rem;
}

.panel h2,
.panel h3 {
    margin: 0 0 7px;
    color: var(--cyan);
    font-family: Orbitron;
}

.panel h2 {
    font-size: 0.98rem;
}

.panel h3 {
    font-size: 0.78rem;
}

.goal {
    line-height: 1.28;
}

.rule {
    margin-top: 7px;
    padding: 7px 9px;
    border-left: 3px solid var(--amber);
    background: #061523;
    color: #ffe7a0;
    font: 12px/1.45 Consolas, monospace;
}

.dialogue {
    margin-top: 7px;
    color: #b9dfec;
    font-style: italic;
}

.builder {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
}

.field {
    display: flex;
    flex-direction: column;
    gap: 3px;
}

.field.full {
    grid-column: 1 / -1;
}

.field label {
    font: 700 0.62rem Orbitron;
    color: #9fc9d9;
}

select,
input {
    width: 100%;
    padding: 8px;
    border: 1px solid #3c7d9c;
    border-radius: 7px;
    outline: none;
    background: #061421;
    color: #eaffff;
    font: 13px Consolas, monospace;
}

select:focus,
input:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 10px #45f3ff33;
}

.code-preview {
    margin-top: 8px;
    padding: 9px;
    border-radius: 8px;
    background: #02080e;
    color: #9dffc3;
    font: 12px/1.45 Consolas, monospace;
    white-space: pre-wrap;
}

.actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 8px;
}

.saved,
.calls {
    max-height: 90px;
    overflow: auto;
    margin-top: 6px;
}

.token {
    padding: 5px 7px;
    margin-top: 4px;
    border: 1px solid #315f79;
    border-radius: 6px;
    background: #071725;
    font: 11px Consolas, monospace;
}

.token b {
    color: var(--amber);
}

.feedback {
    margin-top: 7px;
    min-height: 36px;
    padding: 8px;
    border-radius: 7px;
    background: #071522;
}

.feedback.good {
    border: 1px solid var(--lime);
    color: var(--lime);
}

.feedback.bad {
    border: 1px solid var(--red);
    color: #ff9db2;
}

.levels {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 5px;
}

.level {
    padding: 7px 2px;
    background: #183e5c;
    color: white;
}

.level.active {
    outline: 2px solid var(--cyan);
}

.level.done {
    color: var(--lime);
    border: 1px solid var(--lime);
}

footer {
    text-align: center;
    padding: 8px;
    border-top: 1px solid #2b6480;
    background: #071526;
    color: #bad9e5;
}

.kbd {
    padding: 2px 6px;
    border: 1px solid #4a819e;
    border-radius: 4px;
    background: #193b57;
    color: white;
    font: 700 0.65rem Orbitron;
}

.overlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 18px;
    background: #02060ddc;
    backdrop-filter: blur(7px);
    z-index: 30;
}

.overlay.show {
    display: flex;
}

.modal {
    width: min(620px, 95vw);
    padding: 23px;
    border: 2px solid var(--cyan);
    border-radius: 18px;
    background: linear-gradient(145deg, #173c59, #07111e);
    box-shadow: 0 0 55px #45f3ff55;
    text-align: center;
}

.modal h1 {
    font-family: Orbitron;
    color: var(--cyan);
}

@media (max-width: 980px) {
    main {
        grid-template-columns: 1fr;
    }

    .stage {
        position: relative;
        top: 0;
    }

    .stage canvas {
        width: 100%;
    }

    .stats {
        display: none;
    }
}

@media (max-width: 560px) {
    main {
        padding: 6px;
    }

    .builder {
        grid-template-columns: 1fr;
    }

    .field.full {
        grid-column: auto;
    }

    .stage-message {
        max-width: 92%;
        font-size: 0.8rem;
    }
}
</style>
<script src="shared/audio.js" data-track="fortress"></script>
<script src="shared/storage.js"></script>
<script src="shared/badgeart.js"></script>
<script src="shared/badges.js"></script>
<script src="shared/briefing.js" data-mission="6"></script>
</head>

<body>
<header>
    <div class="brand">
        HACKO
        <small>FUNCTION FORTRESS</small>
    </div>

    <div class="stats">
        <div class="chip">
            MISSION <b id="levelStat">1/10</b>
        </div>

        <div class="chip">
            LIVES <b id="livesStat">3</b>
        </div>

        <div class="chip">
            STONES <b id="stoneStat">0/3</b>
        </div>

        <div class="chip">
            FUNCTIONS <b id="functionStat">0</b>
        </div>
    </div>

    <button
        class="secondary"
        onclick="restartLevel()"
    >
        RESTART
    </button>
</header>

<main>
    <section class="stage">
        <canvas
            id="game"
            width="960"
            height="540"
            aria-label="Function Fortress platform game"
        ></canvas>

        <div
            id="stageMessage"
            class="stage-message"
        >
            Find the glowing CODE button by the door.
        </div>
    </section>

    <aside class="side" id="side">
        <section class="panel">
            <h2 id="missionTitle"></h2>
            <div id="missionGoal" class="goal"></div>
            <div id="missionRule" class="rule"></div>
            <div id="dialogue" class="dialogue"></div>
        </section>

        <section class="panel gated">
            <h3>FUNCTION GAUNTLET</h3>

            <div class="builder">
                <div class="field">
                    <label>FUNCTION NAME</label>
                    <select
                        id="fnName"
                        onchange="previewCode()"
                    ></select>
                </div>

                <div class="field">
                    <label>PARAMETERS</label>
                    <select
                        id="fnParams"
                        onchange="previewCode()"
                    ></select>
                </div>

                <div class="field full">
                    <label>ACTION BLOCK</label>
                    <select
                        id="fnAction"
                        onchange="previewCode()"
                    ></select>
                </div>

                <div class="field">
                    <label>RETURN BLOCK</label>
                    <select
                        id="fnReturn"
                        onchange="previewCode()"
                    ></select>
                </div>

                <div class="field">
                    <label>NESTED CALL</label>
                    <select
                        id="fnNested"
                        onchange="previewCode()"
                    ></select>
                </div>
            </div>

            <div
                id="codePreview"
                class="code-preview"
            ></div>

            <div class="actions">
                <button
                    id="saveFnBtn"
                    onclick="saveFunction()"
                >
                    SAVE FUNCTION
                </button>

                <button
                    class="danger"
                    onclick="clearFunctions()"
                >
                    CLEAR
                </button>
            </div>

            <div
                id="savedFunctions"
                class="saved"
            ></div>
        </section>

        <section class="panel gated">
            <h3>CALL CONSOLE</h3>

            <div class="builder">
                <div class="field">
                    <label>CALL FUNCTION</label>
                    <select id="callName"></select>
                </div>

                <div class="field">
                    <label>ARGUMENT 1</label>
                    <input
                        id="arg1"
                        placeholder="none"
                    >
                </div>

                <div class="field">
                    <label>ARGUMENT 2</label>
                    <input
                        id="arg2"
                        placeholder="none"
                    >
                </div>
            </div>

            <div class="actions">
                <button
                    id="addCallBtn"
                    onclick="addCall()"
                >
                    ADD CALL
                </button>

                <button
                    class="secondary"
                    onclick="removeLastCall()"
                >
                    UNDO CALL
                </button>

                <button onclick="executeProgram()">
                    RUN PROGRAM
                </button>
            </div>

            <div
                id="callList"
                class="calls"
            ></div>

            <div
                id="feedback"
                class="feedback"
            >
                Locked - stand on the CODE button by the door.
            </div>
        </section>

        <section class="panel">
            <h3>MISSION SELECT</h3>
            <div id="levels" class="levels"></div>
        </section>
    </aside>
</main>

<footer>
    <span class="kbd">A D</span> /
    <span class="kbd">← →</span> move

    &nbsp;

    <span class="kbd">SPACE</span> jump

    &nbsp; • &nbsp;

    Collect Function Stones

    &nbsp; • &nbsp;

    Build functions and escape
</footer>

<div
    id="overlay"
    class="overlay"
>
    <div class="modal">
        <h1 id="modalTitle"></h1>
        <p id="modalText"></p>

        <div
            id="solutionCode"
            class="code-preview"
            style="text-align:left"
        ></div>

        <div
            class="actions"
            style="justify-content:center;margin-top:16px"
        >
            <button id="nextBtn">
                NEXT MISSION
            </button>

            <button
                class="secondary"
                onclick="closeOverlay()"
            >
                CLOSE
            </button>
        </div>
    </div>
</div>

<script>
const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

const hacko =
    new Image();

let hackoReady = false;

hacko.src = "hacko.png";

hacko.onload = () => {
    hackoReady = true;
};


/* This fortress teaches methods, but the preview used to render
 * JavaScript - "function name()" - which is not the language this
 * course is about. Java needs a return type on every method and a
 * type on every parameter, so the dropdown values are mapped onto
 * real Java types here.
 */
const PARAM_TYPES = {
    a: "int",
    b: "int",
    color: "String",
    direction: "String",
    distance: "int",
    hasKey: "boolean",
    power: "int",
    mode: "String",
    ready: "boolean",
    token: "String"
};

function javaParams(params) {
    if (!params || params === "none") {
        return "";
    }

    return params
        .split(",")
        .map(part => {
            const name = part.trim();
            return (PARAM_TYPES[name] || "int") + " " + name;
        })
        .join(", ");
}

function javaReturnType(value) {
    if (!value || value === "none") {
        return "void";
    }

    if (value === "true" || value === "false") {
        return "boolean";
    }

    if (value === "success") {
        return "String";
    }

    return "int";
}

function javaReturnValue(value) {
    return value === "success" ? '"success"' : value;
}

const missions = [
    {
        title: "The Sleeping Door",

        goal:
            "Create openDoor() with Open Door, then call it once.",

        rule:
            "void openDoor() { openDoorAction(); } openDoor();",

        dialogue:
            "Hacko: A function is a named spell. " +
            "I define it once, then call it!",

        names: [
            "openDoor",
            "unlock",
            "door"
        ],

        params: [
            "none"
        ],

        actions: [
            "Open Door",
            "Close Door"
        ],

        returns: [
            "none"
        ],

        nested: [
            "none"
        ],

        validate: gameState => {
            return (
                hasFn(
                    gameState,
                    "openDoor",
                    "none",
                    "Open Door"
                ) &&
                calls(
                    gameState,
                    "openDoor"
                ).length === 1
            );
        },

        solution:
`void openDoor() {
    openDoorAction();
}

openDoor();`
    },

    {
        title: "Three Torches",

        goal:
            "Create lightTorch() and call it exactly three times.",

        rule:
            "lightTorch(); lightTorch(); lightTorch();",

        dialogue:
            "Hacko: One function can power many machines. " +
            "Reuse saves work!",

        names: [
            "lightTorch",
            "ignite",
            "torch"
        ],

        params: [
            "none"
        ],

        actions: [
            "Light Torch",
            "Open Door"
        ],

        returns: [
            "none"
        ],

        nested: [
            "none"
        ],

        validate: gameState => {
            return (
                hasFn(
                    gameState,
                    "lightTorch",
                    "none",
                    "Light Torch"
                ) &&
                calls(
                    gameState,
                    "lightTorch"
                ).length === 3
            );
        },

        solution:
`void lightTorch() {
    lightNextTorch();
}

lightTorch();
lightTorch();
lightTorch();`
    },

    {
        title: "Color Bridge",

        goal:
            'Create setColor(color), then call setColor("blue").',

        rule:
            'setColor("blue")',

        dialogue:
            "Hacko: Parameters let the same function " +
            "receive different information.",

        names: [
            "setColor",
            "paintBridge",
            "bridge"
        ],

        params: [
            "color",
            "none"
        ],

        actions: [
            "Set Bridge Color",
            "Open Door"
        ],

        returns: [
            "none"
        ],

        nested: [
            "none"
        ],

        validate: gameState => {
            return (
                hasFn(
                    gameState,
                    "setColor",
                    "color",
                    "Set Bridge Color"
                ) &&
                calls(
                    gameState,
                    "setColor"
                ).some(call => {
                    return clean(call.a) === "blue";
                })
            );
        },

        solution:
`void setColor(String color) {
    bridge.color = color;
}

setColor("blue");`
    },

    {
        title: "Moving Platform",

        goal:
            "Create movePlatform(direction, distance), " +
            "then send it right by 120.",

        rule:
            'movePlatform("right", 120)',

        dialogue:
            "Hacko: Two parameters let me control both " +
            "direction and distance.",

        names: [
            "movePlatform",
            "move",
            "platform"
        ],

        params: [
            "direction, distance",
            "direction",
            "none"
        ],

        actions: [
            "Move Platform",
            "Open Door"
        ],

        returns: [
            "none"
        ],

        nested: [
            "none"
        ],

        validate: gameState => {
            return (
                hasFn(
                    gameState,
                    "movePlatform",
                    "direction, distance",
                    "Move Platform"
                ) &&
                calls(
                    gameState,
                    "movePlatform"
                ).some(call => {
                    return (
                        clean(call.a) === "right" &&
                        Number(call.b) === 120
                    );
                })
            );
        },

        solution:
`void movePlatform(String direction, int distance) {
    platform.move(direction, distance);
}

movePlatform("right", 120);`
    },

    {
        title: "Power Meter",

        goal:
            "Create getPower() that charges the machine, " +
            "returns 50, then call it.",

        rule:
            "return 50",

        dialogue:
            "Hacko: Return sends a value back to the machine " +
            "that called the function.",

        names: [
            "getPower",
            "charge",
            "power"
        ],

        params: [
            "none"
        ],

        actions: [
            "Charge Machine",
            "Read Meter"
        ],

        returns: [
            "50",
            "25",
            "true",
            "none"
        ],

        nested: [
            "none"
        ],

        validate: gameState => {
            return (
                hasFn(
                    gameState,
                    "getPower",
                    "none",
                    "Charge Machine",
                    "50"
                ) &&
                calls(
                    gameState,
                    "getPower"
                ).length >= 1
            );
        },

        solution:
`int getPower() {
    chargeMachine();
    return 50;
}

int power = getPower();`
    },

    {
        title: "Chain Reaction",

        goal:
            "Create unlockGate() containing disableLaser(), " +
            "then call unlockGate().",

        rule:
            "unlockGate() → disableLaser()",

        dialogue:
            "Hacko: Functions can call other functions " +
            "to create a chain reaction.",

        names: [
            "unlockGate",
            "disableLaser",
            "gate"
        ],

        params: [
            "none"
        ],

        actions: [
            "Unlock Gate",
            "Disable Laser"
        ],

        returns: [
            "none"
        ],

        nested: [
            "disableLaser()",
            "none"
        ],

        validate: gameState => {
            return (
                hasFn(
                    gameState,
                    "unlockGate",
                    "none",
                    "Unlock Gate",
                    null,
                    "disableLaser()"
                ) &&
                calls(
                    gameState,
                    "unlockGate"
                ).length >= 1
            );
        },

        solution:
`void unlockGate() {
    disableLaser();
    gate.unlock();
}

unlockGate();`
    },

    {
        title: "Smart Door",

        goal:
            "Create openIfReady(hasKey) with If True: Open Door, " +
            "then call it with true.",

        rule:
            "openIfReady(true)",

        dialogue:
            "Hacko: Logic lets a function choose what to do.",

        names: [
            "openIfReady",
            "smartDoor",
            "openDoor"
        ],

        params: [
            "hasKey",
            "ready",
            "none"
        ],

        actions: [
            "If True: Open Door",
            "Open Door"
        ],

        returns: [
            "none"
        ],

        nested: [
            "none"
        ],

        validate: gameState => {
            return (
                hasFn(
                    gameState,
                    "openIfReady",
                    "hasKey",
                    "If True: Open Door"
                ) &&
                calls(
                    gameState,
                    "openIfReady"
                ).some(call => {
                    return clean(call.a) === "true";
                })
            );
        },

        solution:
`void openIfReady(boolean hasKey) {
    if (hasKey) {
        openDoor();
    }
}

openIfReady(true);`
    },

    {
        title: "The Elevator Sequence",

        goal:
            "Save lowerBridge(), powerElevator(), and " +
            "callElevator(). Call them in that exact order.",

        rule:
            "lowerBridge(); powerElevator(); callElevator();",

        dialogue:
            "Hacko: Small focused functions are easier " +
            "to organize and combine.",

        names: [
            "lowerBridge",
            "powerElevator",
            "callElevator",
            "elevator"
        ],

        params: [
            "none"
        ],

        actions: [
            "Lower Bridge",
            "Power Elevator",
            "Call Elevator"
        ],

        returns: [
            "none"
        ],

        nested: [
            "none"
        ],

        validate: gameState => {
            return (
                hasFn(
                    gameState,
                    "lowerBridge",
                    "none",
                    "Lower Bridge"
                ) &&

/* ---------- timeline: mechanics play out step by step ---------- */

function after(seconds, action) {
    state.timeline.push({
        at: state.clock + seconds,
        action
    });
}

function runTimeline(deltaTime) {
    state.clock += deltaTime;

    const due =
        state.timeline.filter(entry => state.clock >= entry.at);

    state.timeline =
        state.timeline.filter(entry => state.clock < entry.at);

    due.forEach(entry => entry.action());
}

function ease(from, to, seconds, apply) {
    const start = state.clock;

    state.tweens.push(now => {
        const t = Math.min(1, (now - start) / seconds);
        apply(from + (to - from) * t, t);
        return t < 1;
    });
}

function runTweens() {
    state.tweens =
        state.tweens.filter(tween => tween(state.clock));
}

function platformsOf(kind) {
    return state.platforms.filter(platform => platform.kind === kind);
}

function isRiding(player, platform) {
    return (
        platform.solid &&
        player.onGround &&
        Math.abs(player.y + player.h - platform.y) < 3 &&
        player.x + player.w > platform.x &&
        player.x < platform.x + platform.w
    );
}

/* Moving platforms carry Hacko. A jump off one keeps its speed,
   so leaping from the moving platform still lands where it looks
   like it should. */
function movePlatforms(deltaTime) {
    const player = state.player;
    let riding = false;

    state.platforms.forEach(platform => {
        if (!platform.path || !platform.moving) {
            return;
        }

        if (platform.wait > 0) {
            platform.wait -= deltaTime;

            if (isRiding(player, platform)) {
                riding = true;
                player.carry = 0;
            }

            return;
        }

        const goal =
            platform.leg === "to"
                ? platform.path.to
                : platform.from;

        const dx = goal.x - platform.x;
        const dy = goal.y - platform.y;
        const distance = Math.hypot(dx, dy);
        const step = Math.min(distance, platform.path.speed * deltaTime);
        const moveX = distance ? (dx / distance) * step : 0;
        const moveY = distance ? (dy / distance) * step : 0;
        const carrying = isRiding(player, platform);

        platform.x += moveX;
        platform.y += moveY;

        if (platform.kind === "pillar") {
            platform.h = GROUND - platform.y;
        }

        if (carrying) {
            riding = true;
            player.x += moveX;
            player.y = platform.y - player.h;
            player.carry = moveX / deltaTime;
        }

        if (distance <= step + 0.01) {
            if (platform.path.once) {
                platform.moving = false;
            } else {
                platform.leg = platform.leg === "to" ? "from" : "to";
                platform.wait = platform.path.pause || 1;
            }
        }
    });

    if (!riding && player.onGround) {
        player.carry = 0;
    }

    /* the CODE button rides its platform */
    if (CODE_BUTTON.ride !== undefined) {
        const base = state.platforms[CODE_BUTTON.ride];
        CODE_BUTTON.x = base.x + CODE_BUTTON.dx;
        CODE_BUTTON.top = base.y;
    }
}

/* ---------- what running the program does on each stage ---------- */

function openDoorNow() {
    state.doorReady = true;
}

function blinkLasersOff() {
    state.lasers.forEach(laser => {
        if (!laser.steady) {
            laser.on = false;
        }
    });
}
